<style>
:root {
  --bg: #120E24; --bg2: #18123A; --panel: #1C1640; --panel2: #241C52; --line: #332A66; --line2: #463B85;
  --ink: #F4F1FF; --mute: #B8B0DC; --dim: #7F76AD;
  --lux: #FFB547; --lux2: #FFD38A; --win: #5EE6A0; --lose: #FF5A6E; --chalk: #F6F3FF; --grass: #241C52;
  --fd: "Bungee", "Arial Black", sans-serif; --fk: "Nunito", system-ui, sans-serif; --fb: "Nunito", system-ui, sans-serif; --fm: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--fb); }
body { min-height: 100vh; background: radial-gradient(900px 480px at 80% -10%, rgba(255, 181, 71, .14), transparent 62%), radial-gradient(800px 500px at 0% 30%, rgba(167, 139, 250, .16), transparent 60%), radial-gradient(1px 1px at 20% 30%, #fff8 50%, transparent), radial-gradient(1px 1px at 70% 15%, #fff6 50%, transparent), radial-gradient(1px 1px at 40% 70%, #fff5 50%, transparent), var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
.ic { width: 1.1em; height: 1.1em; flex: none; vertical-align: -0.18em; }
.muted { color: var(--mute); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
.row.center, .center .row { justify-content: center; }
.row.sm { margin-top: 8px; gap: 16px; }
.err { color: #FFC2C4; background: rgba(255, 90, 95, .12); border: 1px solid rgba(255, 90, 95, .4); padding: 8px 12px; border-radius: 6px; margin: 0; font-size: 15px; }
.eyebrow { margin: 0 0 6px; font: 600 13px var(--fk); letter-spacing: .14em; text-transform: uppercase; color: var(--lux); display: flex; align-items: center; gap: 6px; }
[style*="--fc"] .eyebrow { color: var(--fc); }
h2 { font: 800 28px/1.1 var(--fd); letter-spacing: .02em; margin: 0 0 10px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
h3 { font: 700 18px var(--fk); letter-spacing: .06em; text-transform: uppercase; margin: 18px 0 8px; }
:focus-visible { outline: 3px solid var(--lux); outline-offset: 2px; }

/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; padding: 11px 18px; font: 700 17px var(--fk); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line2); background: var(--panel2); color: var(--ink); transition: transform .12s, filter .12s; }
.btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.hot { background: linear-gradient(180deg, var(--lux2), var(--lux)); color: #2A1600; border-color: #FFE2B0; box-shadow: 0 8px 24px -10px rgba(255, 181, 71, .8), inset 0 1px 0 rgba(255,255,255,.5); }
.btn.big { padding: 14px 24px; font-size: 19px; }
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: rgba(255, 90, 95, .5); color: #FFC2C4; }
.link { background: none; border: 0; color: var(--lux2); text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; font-size: 15px; }
.link.sm { font-size: 14px; }

/* capa */
.cover { position: relative; min-height: 100vh; overflow: hidden; display: grid; place-items: center; padding: 28px 16px 40px; }
.lab-bg { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; gap: 2vw; opacity: .22; pointer-events: none; padding-bottom: 2vh; }
.lab-bg svg { width: min(30vw, 340px); height: auto; }
.cover-in { position: relative; width: min(600px, 100%); }
.cover-brand { display: flex; align-items: center; gap: 12px; font: 600 14px var(--fk); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.logo { height: 34px; background: #fff; padding: 4px 8px; border-radius: 6px; }
.kicker { margin: 24px 0 2px; font: 600 15px var(--fk); color: var(--lux); letter-spacing: .18em; text-transform: uppercase; }
.title { margin: 0; font: 400 clamp(40px, 9vw, 80px)/1 var(--fd); letter-spacing: 0; text-transform: uppercase; letter-spacing: .01em; }
.title span { display: block; color: var(--lux); font-size: .6em; }
.lede { color: var(--mute); max-width: 52ch; }
.lede b { color: var(--ink); }
.resume { background: rgba(59, 224, 122, .08); border: 1px solid rgba(59, 224, 122, .35); border-radius: 10px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.resume p { margin: 0; font-size: 15px; }
.crew { margin-top: 18px; display: grid; gap: 14px; background: rgba(16, 19, 24, .88); backdrop-filter: blur(6px); border: 1px solid var(--line2); border-radius: 14px; padding: 18px; }
.fld { display: grid; gap: 6px; }
.fld span, .seg legend { font: 600 14px var(--fk); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.fld input { background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; padding: 12px; color: var(--ink); font: 17px var(--fb); }
.seg { border: 0; padding: 0; margin: 0; display: flex; gap: 8px; flex-wrap: wrap; }
.seg legend { margin-bottom: 6px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: inline-flex; align-items: center; padding: 9px 20px; border: 1px solid var(--line2); border-radius: 8px; font: 700 18px var(--fk); letter-spacing: .06em; }
.seg input:checked + span { background: var(--lux); color: #2A1600; border-color: var(--lux); }
.seg input:focus-visible + span { outline: 3px solid var(--lux); outline-offset: 2px; }
.seg.cores span { padding: 4px; border-radius: 10px; }
.seg.cores input:checked + span { background: rgba(255, 181, 71, .18); border-color: var(--lux); box-shadow: 0 0 0 2px var(--lux) inset; }
.seg.cores .shirt { width: 40px; height: 40px; }
.cover-links { display: flex; gap: 18px; margin-top: 14px; }
.shirt { width: 48px; height: 48px; flex: none; filter: drop-shadow(0 3px 4px rgba(0,0,0,.4)); }
.shirt.mini { width: 24px; height: 24px; filter: none; }

/* HUD */
.hud { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: rgba(10, 12, 15, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.hud-brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; color: var(--lux); }
.hud-brand .ic { width: 26px; height: 26px; }
.hud-brand span { display: grid; font: 800 17px/1 var(--fd); letter-spacing: .04em; text-align: left; }
.hud-brand small { font: 600 11px var(--fk); letter-spacing: .16em; color: var(--mute); }
.hud-cells { display: flex; gap: 4px; margin-left: auto; }
.hud-cell { display: grid; padding: 2px 10px; border-left: 1px solid var(--line); min-width: 62px; text-align: center; }
.hud-cell span { font: 600 11px var(--fk); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.hud-cell b { font: 600 17px var(--fm); }
.hud-menu { background: none; border: 1px solid var(--line2); border-radius: 8px; width: 40px; height: 40px; font-size: 18px; }
.proj-tag { font: 700 12px var(--fk); letter-spacing: .14em; color: #2A1600; background: var(--lux); padding: 3px 8px; border-radius: 4px; }
@media (max-width: 640px) { .hud { flex-wrap: wrap; gap: 6px; padding: 8px 12px; } .hud-cells { order: 3; width: 100%; margin: 0; justify-content: space-between; } .hud-cell { min-width: 0; flex: 1; padding: 0 4px; } .hud-menu { margin-left: auto; } .hide-s { display: none; } }

/* páginas e cartões */
.wrap { width: min(980px, calc(100% - 32px)); margin: 20px auto 48px; display: grid; gap: 18px; }
.card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 16px; padding: 20px; position: relative; min-width: 0; }
.card[style*="--fc"] { border-top: 4px solid var(--fc); }
.card.center { text-align: center; }
.card.center .eyebrow { justify-content: center; }
.card.center h2 { justify-content: center; }
.next { overflow: hidden; }
.next::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 60px, rgba(255,255,255,.025) 60px 120px); pointer-events: none; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin: 10px 0 4px; position: relative; }
.vs-t { display: grid; justify-items: center; gap: 6px; text-align: center; }
.vs-t .shirt { width: 72px; height: 72px; }
.vs-t b { font: 800 22px/1.05 var(--fd); text-transform: uppercase; letter-spacing: .02em; }
.vs-x { font: 800 40px var(--fd); color: var(--lux); }
.vs-sub { text-align: center; color: var(--mute); margin: 6px 0 14px; position: relative; }
.next .btn { display: flex; margin: 0 auto; position: relative; }
.fire { color: #FFB067; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.stats div { background: rgba(0,0,0,.22); border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; display: grid; }
.stats b { font: 800 30px/1 var(--fd); }
.stats span { font: 600 13px var(--fk); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.stats.big b { font-size: 40px; color: var(--lux); }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }

/* trilha de fases */
.trilha { display: grid; gap: 8px; }
.fase { display: grid; grid-template-columns: minmax(140px, 1.1fr) 2fr auto; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-left: 4px solid var(--fc); border-radius: 10px; background: rgba(0,0,0,.18); }
.fase.atual { background: rgba(255, 181, 71, .07); border-color: rgba(255, 181, 71, .4); border-left-color: var(--fc); }
.fase-h { display: grid; line-height: 1.15; }
.fase-h b { font: 800 17px var(--fd); text-transform: uppercase; color: var(--fc); }
.fase-h span { font-weight: 600; }
.fase-h small { color: var(--mute); font-size: 14px; }
.jogos { display: flex; gap: 6px; flex-wrap: wrap; }
.jg { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--fm); border: 1px dashed var(--line2); color: var(--dim); }
.jg.v { background: var(--win); color: #04210F; border: 0; font-weight: 700; }
.jg.d { background: var(--lose); color: #2A0405; border: 0; font-weight: 700; }
.jg.prox { border: 2px solid var(--lux); color: var(--lux); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(255, 181, 71, .15); } }
@media (max-width: 600px) { .fase { grid-template-columns: 1fr auto; } .jogos { grid-column: 1 / -1; order: 3; } .jg { width: 38px; height: 38px; } }

/* tabela da liga */
.tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.liga { width: 100%; border-collapse: collapse; font: 15px var(--fb); }
.liga th { font: 600 13px var(--fk); letter-spacing: .1em; color: var(--dim); text-align: center; padding: 6px 6px; border-bottom: 1px solid var(--line2); }
.liga th:nth-child(2) { text-align: left; }
.liga td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: center; font-family: var(--fm); font-size: 14px; }
.liga td.tm { text-align: left; font-family: var(--fb); font-size: 15px; white-space: nowrap; }
.liga td.tm .tmi { display: flex; align-items: center; gap: 8px; }
.liga td.tm span { overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
.liga tr.eu td { background: rgba(255, 181, 71, .12); font-weight: 700; }
.liga tr.eu td.tm span { color: var(--lux); }
.pos { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; font-weight: 700; }
.z1 .pos { background: var(--lux); color: #2A1600; } .z2 .pos { background: #2F8CFF; color: #fff; } .z3 .pos { background: #18A0A0; color: #fff; } .z5 .pos { background: var(--lose); color: #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font: 600 13px var(--fk); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); margin: 10px 0 0; }
.legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.legend .z1::before { background: var(--lux); } .legend .z2::before { background: #2F8CFF; } .legend .z3::before { background: #18A0A0; } .legend .z5::before { background: var(--lose); }

/* preleção */
.quadro { background: #161B21; border: 2px solid #36404B; border-radius: 12px; padding: 16px 18px; font-size: 17px; background-image: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px); background-size: 14px 14px; }
.quadro p { margin: 0 0 10px; } .quadro ul { margin: 0 0 10px; padding-left: 20px; }
.formula { font: 600 20px var(--fm); text-align: center; background: rgba(0,0,0,.28); border-radius: 10px; padding: 12px; margin: 10px 0 12px; color: var(--lux2); display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.fr { display: inline-grid; text-align: center; font-size: 15px; } .fr i { font-style: normal; padding: 2px 6px; } .fr i:first-child { border-bottom: 2px solid currentColor; }

/* partida */
.placar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: #06080A; border: 2px solid #252C35; border-radius: 14px; padding: 10px 14px; box-shadow: inset 0 0 30px rgba(0,0,0,.6); position: sticky; top: 60px; z-index: 5; }
.pl-t { display: flex; align-items: center; gap: 8px; font: 800 24px var(--fd); letter-spacing: .04em; }
.pl-t.r { justify-content: flex-end; }
.pl-t .shirt.mini { width: 30px; height: 30px; }
.pl-s { display: grid; justify-items: center; }
.pl-s span { font: 600 38px/1 var(--fm); color: var(--lux); text-shadow: 0 0 14px rgba(255, 181, 71, .55); letter-spacing: .04em; }
.pl-s span i { font-style: normal; color: var(--dim); font-size: .7em; padding: 0 4px; }
.pl-s small { font: 600 12px var(--fk); letter-spacing: .12em; color: var(--dim); text-transform: uppercase; margin-top: 4px; }
.placar.win .pl-s span { color: var(--win); text-shadow: 0 0 14px rgba(59, 224, 122, .6); }
.placar.lose .pl-s span { color: var(--lose); text-shadow: 0 0 14px rgba(255, 90, 95, .5); }
@media (max-width: 640px) { .placar { top: 92px; padding: 8px 10px; } .pl-s span { font-size: 30px; } .pl-t { font-size: 20px; } }
.campo { display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 820px) { .campo { grid-template-columns: 1fr; } }
.lance { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-top: 4px solid var(--fc); border-radius: 16px; padding: 18px; min-width: 0; }
.ctx { margin: 0 0 8px; }
.ask { font-size: 19px; margin: 12px 0 0; padding: 12px 14px; border-left: 4px solid var(--fc); background: rgba(0,0,0,.2); border-radius: 0 10px 10px 0; }
.viz { margin: 10px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: grid; justify-items: center; min-width: 64px; padding: 6px 10px; background: var(--chalk); color: #1E1A12; border-radius: 10px; box-shadow: 0 3px 0 #BFB59C; }
.chip small { font: 600 11px var(--fk); letter-spacing: .08em; text-transform: uppercase; color: #6B6250; }
.chip b { font: 600 20px var(--fm); }
.viz svg { width: 100%; max-width: 460px; height: auto; display: block; background: rgba(0,0,0,.2); border-radius: 10px; }
.viz .gl { stroke: rgba(255,255,255,.08); } .viz .ax { fill: var(--mute); font: 12px var(--fm); } .viz .axt { fill: var(--mute); font: 600 12px var(--fk); letter-spacing: .06em; }
.viz .bar { fill: var(--fc, var(--lux)); } .viz .bv { fill: var(--ink); font: 600 12px var(--fm); }
.dt { border-collapse: collapse; min-width: 220px; background: rgba(0,0,0,.2); border-radius: 10px; overflow: hidden; }
.dt th { font: 600 13px var(--fk); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); padding: 8px 14px; background: rgba(0,0,0,.25); }
.dt td { font: 600 17px var(--fm); text-align: center; padding: 6px 14px; border-top: 1px solid var(--line); }
.doc { display: grid; gap: 0; background: var(--chalk); color: #1E1A12; border-radius: 10px; padding: 6px 14px; box-shadow: 0 3px 0 #BFB59C; max-width: 460px; }
.doc div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dashed #BFB59C; }
.doc div:last-child { border: 0; }
.doc span { font: 600 14px var(--fk); letter-spacing: .06em; text-transform: uppercase; color: #6B6250; }
.doc b { font: 600 17px var(--fm); text-align: right; }
.chute, .result { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 16px; padding: 16px; position: sticky; top: 150px; }
@media (max-width: 820px) { .chute, .result { position: static; } }
.hint { font-size: 14px; margin: 8px 0 0; }

/* teclado */
.kp { display: grid; gap: 10px; }
.kp-screen { background: #06080A; border: 2px solid #252C35; border-radius: 12px; padding: 8px 12px; }
.kp-l { font: 600 12px var(--fk); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.kp-v { display: flex; align-items: baseline; gap: 6px; min-height: 44px; }
.kp-num { font: 600 34px var(--fm); color: var(--lux); }
.kp-num.empty { font-size: 0; }
.kp-num.empty::after { content: '_'; font-size: 34px; color: var(--dim); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.kp-u { font: 600 15px var(--fk); color: var(--mute); }
.kp-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kp-keys button { font: 600 24px var(--fm); padding: 12px 0; border-radius: 10px; background: var(--panel2); border: 1px solid var(--line2); box-shadow: 0 3px 0 #05070A; }
.kp-keys button:active { transform: translateY(2px); box-shadow: none; }
.kp.locked { opacity: .5; pointer-events: none; }

/* resultado */
.result h2 { justify-content: center; font-size: 34px; margin-top: 8px; }
.result.win h2 { color: var(--win); } .result.lose h2 { color: var(--lose); }
.result > p { text-align: center; }
.sol { background: rgba(0,0,0,.22); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 12px; text-align: left; }
.passos { margin: 0; padding-left: 22px; } .passos li { margin: 4px 0; }
.lanceanim { width: 100%; max-width: 360px; display: block; margin: 0 auto; border-radius: 12px; }
.lanceanim .bola { transform: translate(110px, 104px); }
.lanceanim.gol .bola { animation: chuteGol 1.1s cubic-bezier(.2,.7,.3,1) forwards; }
.lanceanim.gol .goleiro { animation: pulaErrado 1.1s ease-out forwards; transform-origin: 110px 92px; }
.lanceanim.gol .trave g { animation: rede .5s 1s ease-out; }
.lanceanim.def .bola { animation: chuteDef 1.1s cubic-bezier(.2,.7,.3,1) forwards; }
.lanceanim.def .goleiro { animation: pulaCerto 1.1s ease-out forwards; transform-origin: 110px 92px; }
@keyframes chuteGol { 0% { transform: translate(110px, 104px) scale(1.4); } 70% { transform: translate(146px, 40px) scale(.8); } 100% { transform: translate(150px, 46px) scale(.8); } }
@keyframes pulaErrado { 0% { transform: none; } 60%, 100% { transform: translateX(-14px) rotate(-55deg); } }
@keyframes chuteDef { 0% { transform: translate(110px, 104px) scale(1.4); } 55% { transform: translate(84px, 48px) scale(.85); } 100% { transform: translate(30px, 20px) scale(.7); } }
@keyframes pulaCerto { 0% { transform: none; } 45%, 100% { transform: translateX(-8px) rotate(-40deg); } }
@keyframes rede { 50% { transform: translateY(3px); } }
@media (prefers-reduced-motion: reduce) { .lanceanim * { animation-duration: .01s !important; } }

/* fim de fase e final */
.pod-h { display: flex; align-items: center; justify-content: center; gap: 8px; }
.podium { list-style: none; padding: 0; margin: 8px auto 0; max-width: 560px; text-align: left; }
.podium li { display: grid; grid-template-columns: 36px 1fr auto auto; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: rgba(0,0,0,.2); margin-bottom: 6px; border: 1px solid var(--line); }
.podium li.top { border-color: rgba(255, 181, 71, .35); }
.podium li.me { background: rgba(255, 181, 71, .14); border-color: var(--lux); }
.p-n { font: 600 18px var(--fm); text-align: center; }
.p-t { font: 600 13px var(--fk); letter-spacing: .1em; color: var(--mute); }
.p-r { grid-column: 2 / 4; font-size: 13px; color: var(--mute); }
.podium .p-r { order: 5; }
.p-p { font: 600 18px var(--fm); color: var(--lux); }
.p-p small { font-size: 12px; color: var(--mute); }
.p-mine { text-align: center; margin: 8px 0 0; }
.final .taca { width: 88px; height: 88px; margin: 0 auto 6px; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle, rgba(255, 181, 71, .3), transparent 70%); color: var(--lux); animation: brilho 2s infinite; }
.final .taca .ic { width: 64px; height: 64px; stroke-width: 1.6; }
@keyframes brilho { 50% { box-shadow: 0 0 40px rgba(255, 181, 71, .5); } }
.final .zona { font: 800 26px var(--fd); color: var(--lux); text-transform: uppercase; margin: 0; }
.porfase { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.porfase div { border: 1px solid var(--line); border-top: 4px solid var(--fc); border-radius: 10px; padding: 8px; display: grid; background: rgba(0,0,0,.2); }
.porfase b { font: 800 26px var(--fd); }
.porfase span { font-size: 13px; color: var(--mute); }
@media (max-width: 600px) { .porfase { grid-template-columns: repeat(2, 1fr); } }
.copy-box { width: 100%; min-height: 150px; margin-top: 10px; background: var(--bg); color: var(--ink); border: 1px solid var(--line2); border-radius: 8px; padding: 10px; font: 14px var(--fm); }
.hall { list-style: none; padding: 0; margin: 0; }
.hall li { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); align-items: center; }
.hall li > span:nth-child(3) { color: var(--mute); font-size: 14px; }
.hall li > span:nth-child(4) { grid-column: 2; font-size: 13px; color: var(--mute); order: 5; }
.h-n { font: 600 15px var(--fm); color: var(--dim); }
.h-p { font: 600 16px var(--fm); color: var(--lux); }

/* professor */
.tcards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tcards > div { background: rgba(0,0,0,.2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.tcards h3 { margin-top: 0; }
@media (max-width: 680px) { .tcards { grid-template-columns: 1fr; } }
.live-h { display: flex; align-items: center; gap: 8px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
.dot.on { background: var(--win); box-shadow: 0 0 0 3px rgba(59, 224, 122, .2); animation: pulse 1.6s infinite; }
.dot.fim { background: var(--lux); }
.prof-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.seg-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.seg-tabs button { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 12px; font: 600 15px var(--fk); letter-spacing: .04em; }
.seg-tabs button.on { background: var(--lux); color: #2A1600; border-color: var(--lux); }
.seg-tabs.big button { padding: 8px 14px; font-size: 16px; }
.live-tag { font-size: 13px; display: flex; align-items: center; gap: 6px; }
table.live { width: 100%; border-collapse: collapse; font-size: 14px; }
.live th { font: 600 12px var(--fk); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line2); }
.live td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.live td small { display: block; color: var(--mute); font-size: 12px; }
.live td.num { font-family: var(--fm); text-align: right; }
.live tr.on td { background: rgba(59, 224, 122, .05); }
.ok { color: var(--win); } .warn { color: #FFB067; font-weight: 700; }
.feed-h { margin-top: 18px; }
.feed { list-style: none; padding: 0; margin: 0; font-size: 14px; max-height: 340px; overflow: auto; }
.feed li { padding: 5px 0; border-bottom: 1px solid var(--line); }
.local { margin-top: 18px; } .local summary { cursor: pointer; color: var(--mute); }
.pulse { animation: pulse 1.4s infinite; }

/* modal, toast e alerta */
.veil { position: fixed; inset: 0; z-index: 50; background: rgba(4, 5, 7, .74); display: grid; place-items: center; padding: 16px; }
.modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel2); border: 1px solid var(--line2); border-radius: 16px; padding: 20px; }
.modal h3 { margin-top: 0; }
.menu { display: grid; gap: 8px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 140%); background: var(--chalk); color: #1E1A12; padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 60; transition: transform .25s, opacity .25s; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; }
.toast.on { transform: translate(-50%, 0); opacity: 1; }
#guard { position: fixed; inset: 0; z-index: 80; background: rgba(4, 5, 7, .94); display: grid; place-items: center; padding: 16px; }
.guard-box { width: min(480px, 100%); text-align: center; background: var(--panel2); border: 2px solid var(--lux); border-radius: 16px; padding: 24px; }
.guard-ic { font-size: 40px; color: var(--lux); }
.guard-box small { display: block; font: 600 13px var(--fk); letter-spacing: .16em; color: var(--lux); }
.guard-box h2 { justify-content: center; margin-top: 6px; }
.guard-box dl { display: flex; justify-content: center; gap: 24px; margin: 14px 0; }
.guard-box dt { font: 600 12px var(--fk); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.guard-box dd { margin: 0; font: 600 26px var(--fm); }
body.proj .placar { position: static; }

/* ===== cofre ===== */
.hud-cell.clock b { color: var(--win); }
.hud-cell.clock.late b, .hud-cell.late b { color: var(--lose); }
.hud-cell b { white-space: nowrap; }
.stats b { font-size: 26px; }
.planta { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: auto auto; gap: 10px; margin: 8px 0 4px; padding: 12px; border: 2px solid #2B3540; border-radius: 12px; background: linear-gradient(rgba(70, 194, 242, .05) 1px, transparent 1px) 0 0 / 22px 22px, linear-gradient(90deg, rgba(70, 194, 242, .05) 1px, transparent 1px) 0 0 / 22px 22px, #0E1217; }
.room { grid-row: 1; grid-column: span 2; display: grid; gap: 2px; text-align: left; padding: 14px; border-radius: 10px; border: 2px solid var(--line2); background: rgba(0,0,0,.3); color: var(--ink); min-height: 120px; align-content: start; }
.room.r4, .room.r5 { grid-row: 2; grid-column: span 3; }
.room-n { font: 700 12px var(--fk); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.room b { font: 800 22px/1.05 var(--fd); text-transform: uppercase; letter-spacing: .03em; }
.room small { color: var(--mute); }
.room-st { margin-top: 8px; display: flex; align-items: center; gap: 6px; font: 700 13px var(--fk); }
.room.trancada { opacity: .55; cursor: not-allowed; border-style: dashed; }
.room.atual { border-color: var(--fc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--fc) 22%, transparent), inset 0 0 40px color-mix(in srgb, var(--fc) 12%, transparent); animation: pulse 2s infinite; }
.room.atual .room-st { color: var(--fc); }
.room.aberta { border-color: color-mix(in srgb, var(--win) 60%, transparent); }
.room.aberta .room-st { color: var(--win); }

.corredor { grid-row: 2; grid-column: 1 / -1; display: grid; place-items: center; font: 700 11px var(--fk); letter-spacing: .3em; color: var(--dim); border-top: 1px dashed var(--line2); border-bottom: 1px dashed var(--line2); }
@media (max-width: 640px) { .planta { grid-template-columns: 1fr 1fr; grid-template-rows: none; } .room, .room.r4, .room.r5 { grid-row: auto; grid-column: span 1; min-height: 0; } .room.r5 { grid-column: 1 / -1; } .corredor { display: none; } }
.intro { font-size: 18px; }
.sala-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.btn.sm { padding: 8px 12px; font-size: 14px; }
.porta-mini { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: #0B0E12; border: 2px solid #2B3540; margin: 10px 0 14px; }
.porta-mini > .ic { width: 26px; height: 26px; color: var(--lux); }
.porta-mini > span { font: 700 13px var(--fk); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.slots { display: flex; gap: 6px; justify-content: center; }
.slot { width: 38px; height: 48px; display: grid; place-items: center; border-radius: 8px; background: #06080A; border: 2px solid var(--line2); font: 700 24px var(--fm); color: var(--dim); }
.slot.on { color: var(--win); border-color: color-mix(in srgb, var(--win) 50%, transparent); text-shadow: 0 0 10px rgba(70, 242, 138, .6); }
.objs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 720px) { .objs { grid-template-columns: 1fr 1fr; } }
@media (max-width: 420px) { .objs { grid-template-columns: 1fr; } }
.obj { position: relative; display: grid; gap: 4px; text-align: left; padding: 14px 14px 12px 50px; border-radius: 12px; border: 1px solid var(--line2); background: linear-gradient(180deg, #1C222A, #151A20); color: var(--ink); min-height: 86px; align-content: center; }
.obj:hover { border-color: var(--fc); }
.obj-n { position: absolute; left: 12px; top: 14px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--fm); background: #0B0E12; border: 1px solid var(--line2); }
.obj b { font: 700 16px var(--fb); }
.obj small { display: flex; align-items: center; gap: 5px; color: var(--mute); font-size: 13px; }
.obj.ok { border-color: color-mix(in srgb, var(--win) 45%, transparent); } .obj.ok small { color: var(--win); } .obj.ok .obj-n { background: var(--win); color: #03140A; border: 0; }
.obj.fail { border-color: color-mix(in srgb, var(--lose) 45%, transparent); } .obj.fail small { color: var(--lose); } .obj.fail .obj-n { background: var(--lose); color: #fff; border: 0; }
.obj.meio small { color: #FFB067; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; filter: none; box-shadow: none; }
.tent { display: flex; align-items: center; gap: 8px; font: 700 13px var(--fk); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin-bottom: 10px; }
.tent i { width: 14px; height: 14px; border-radius: 50%; background: var(--win); box-shadow: 0 0 8px rgba(70, 242, 138, .6); }
.tent i.usada { background: var(--lose); box-shadow: 0 0 8px rgba(255, 77, 94, .6); }
.warnbox { margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; background: rgba(255, 77, 94, .12); border: 1px solid rgba(255, 77, 94, .45); font-size: 15px; }
.big-ic { display: grid; place-items: center; }
.big-ic .ic { width: 64px; height: 64px; }
.result.win .big-ic { color: var(--win); } .result.lose .big-ic { color: var(--lose); animation: sirene .5s 3; }
@keyframes sirene { 50% { filter: drop-shadow(0 0 16px var(--lose)); transform: scale(1.1); } }
.digit { display: grid; justify-items: center; gap: 2px; margin: 12px auto 0; padding: 10px; border-radius: 12px; background: #06080A; border: 2px solid var(--line2); max-width: 280px; font: 700 13px var(--fk); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.digit b { font: 700 40px var(--fm); color: var(--win); text-shadow: 0 0 14px rgba(70, 242, 138, .6); }
.digit small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--dim); }
.porta .slots { margin: 6px 0 14px; }
.cofre { width: min(340px, 100%); margin: 0 auto; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.door-anim { perspective: 600px; display: grid; place-items: center; margin: 4px 0 10px; }
.door { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, #3A434E 0 30%, #2A313A 31% 60%, #1E242B 61%); border: 6px solid var(--lux); position: relative; animation: abre 1.6s .2s ease-in-out forwards; box-shadow: 0 0 30px rgba(255, 181, 71, .3); }
.door i { position: absolute; inset: 38%; border-radius: 50%; border: 4px solid var(--lux); }
.door i::before, .door i::after { content: ''; position: absolute; left: 50%; top: -40%; width: 4px; height: 180%; background: var(--lux); transform: translateX(-50%); }
.door i::after { transform: translateX(-50%) rotate(90deg); }
@keyframes abre { 70% { transform: rotate(270deg); } 100% { transform: rotate(270deg); border-color: var(--win); box-shadow: 0 0 50px rgba(70, 242, 138, .55); } }
@media (prefers-reduced-motion: reduce) { .door { animation: none; } }
.final .taca .ic { stroke-width: 1.4; }

/* ===== laboratório ===== */
h2 { text-transform: none; letter-spacing: -.01em; }
.hud-brand span, .room b, .stats b, .porfase b, .final .zona { text-transform: none; }
.lab-fig { display: grid; justify-items: center; gap: 4px; margin: 10px 0; }
.lab-fig svg.shape { width: 100%; max-width: 320px; height: auto; background: radial-gradient(circle at 50% 40%, rgba(94,234,212,.07), transparent 70%); border-radius: 14px; }
.lab-fig figcaption { font: 700 13px var(--fk); color: var(--mute); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.duo .lab-fig { margin: 4px 0; }
.shape .face { fill: rgba(255, 181, 71, .10); stroke: #E7E2FF; stroke-width: 2; stroke-linejoin: round; }
.shape .face.side { fill: rgba(255, 181, 71, .05); }
.shape .liq { fill: var(--lc); opacity: .35; }
.shape .edge { fill: none; stroke: #E7E2FF; stroke-width: 2; }
.shape .hid { fill: none; stroke: #E7E2FF; stroke-width: 1.4; stroke-dasharray: 5 5; opacity: .55; }
.shape .dim { stroke: var(--lux); stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
.shape .dim.r { stroke: #FBBF24; }
.shape .dim.g { stroke: #F472B6; stroke-dasharray: none; stroke-width: 3; }
.shape .lb { font: 700 14px var(--fm); fill: #fff; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; }
.frascos { display: flex; gap: 5px; }
.fr-ic { width: 26px; color: #9FBCC0; display: block; }
.fr-ic svg { width: 100%; height: auto; display: block; }
.fr-ic .lv { fill: var(--lc); }
.fr-ic.perdido { color: var(--lose); }
.fr-ic.perdido .lv { fill: var(--lose); opacity: .5; }
.room .frascos { margin-top: 10px; }
.room .fr-ic { width: 20px; }
.porta-mini .fr-ic { width: 30px; }
.rel-fr { display: flex; justify-content: center; margin-bottom: 8px; }
.rel-fr .fr-ic { width: 42px; }
.big-flask { display: grid; place-items: center; color: #E7E2FF; }
.big-flask svg { width: 110px; height: auto; }
.big-flask .lvg { fill: var(--lc); transform: translateY(100%); }
.big-flask .enche .lvg { animation: enche 1.2s .15s ease-out forwards; }
.big-flask .derrama .lvg { fill: var(--lose); opacity: .55; transform: translateY(82%); }
.big-flask .bolhas circle { fill: #fff; opacity: .7; animation: bolha 1.6s 1s ease-in infinite; }
.big-flask .bolhas circle:nth-child(2) { animation-delay: 1.4s; } .big-flask .bolhas circle:nth-child(3) { animation-delay: 1.8s; }
.big-flask .poca { fill: var(--lose); opacity: .6; }
.result.lose .big-flask svg { animation: sirene .5s 2; }
@keyframes enche { to { transform: translateY(42%); } }
@keyframes bolha { 0% { transform: translateY(0); opacity: .7; } 100% { transform: translateY(-40px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .big-flask .enche .lvg { animation: none; transform: translateY(42%); } .big-flask .bolhas circle { animation: none; } }
.final .taca .ic { stroke-width: 1.5; }

.passos .fr, .ctx .fr { vertical-align: middle; font-size: .82em; margin: 0 2px; }
.passos .fr i:first-child, .ctx .fr i:first-child { border-bottom-width: 1.5px; }
.planta { min-width: 0; }
.room { min-width: 0; }
@media (max-width: 640px) { .planta { grid-template-columns: 1fr; } .room, .room.r4, .room.r5 { grid-column: auto; } .room .fr-ic { width: 18px; } }
/* alternativas */
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line2); background: linear-gradient(180deg, #2A2160, #211A4D); color: var(--ink); transition: border-color .15s, background .15s, transform .1s; }
.opt:hover:not(:disabled) { border-color: var(--lux); }
.opt:active:not(:disabled) { transform: translateY(1px); }
.opt-l { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 16px var(--fm); background: #120E24; border: 1px solid var(--line2); }
.opt-v { font: 700 19px var(--fm); font-variant-numeric: tabular-nums; }
.opt.on { border-color: var(--lux); background: rgba(255, 181, 71, .14); box-shadow: 0 0 0 3px rgba(255, 181, 71, .18); }
.opt.on .opt-l { background: var(--lux); color: #2A1600; border-color: var(--lux); }
.opt.riscada { opacity: .45; cursor: not-allowed; }
.opt.riscada .opt-v { text-decoration: line-through; text-decoration-color: var(--lose); text-decoration-thickness: 2px; }
.opt.riscada .opt-l { background: var(--lose); color: #fff; border-color: var(--lose); }

/* ===== caçadores de raízes ===== */
h2, .room b, .hud-brand span, .stats b, .porfase b { font-family: var(--fd); font-weight: 400; letter-spacing: .01em; }
.px { font-family: var(--fm); font-weight: 700; white-space: nowrap; background: rgba(255,255,255,.06); padding: 1px 6px; border-radius: 6px; }
.px sup, .opt-v sup { font-size: .68em; }
.ctx .px { line-height: 2; }
.opt-v { font: 700 17px var(--fm); line-height: 1.4; }
.ruff { display: inline-grid; gap: 2px; margin: 6px 0; }
.ruff table { border-collapse: collapse; font: 700 15px var(--fm); }
.ruff td { padding: 4px 10px; text-align: center; min-width: 34px; }
.ruff tr:first-child td { border-bottom: 2px solid var(--mute); }
.ruff td.ra { border-right: 2px solid var(--mute); color: var(--lux); }
.ruff td.rr { color: var(--lux); outline: 2px solid var(--lux); outline-offset: -2px; border-radius: 4px; }
.ruff small { color: var(--mute); }
.passos li .ruff { display: grid; }
.golpes { display: flex; gap: 5px; }
.gp { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; border: 1.5px dashed var(--line2); color: var(--dim); }
.gp.cheio { background: var(--lc); color: #120E24; border: 0; }
.gp.perdido { background: rgba(255, 90, 110, .25); color: var(--lose); border: 1.5px solid var(--lose); }
.room .golpes { margin-top: 10px; }
.monstro { width: 110px; height: auto; display: block; overflow: visible; }
.monstro .pupila { animation: olhar 4s ease-in-out infinite; }
@keyframes olhar { 0%, 100% { transform: translateX(0); } 40% { transform: translateX(-3px); } 70% { transform: translateX(3px); } }
.arena { gap: 18px; }
.arena .monstro { width: 92px; }
.arena > div { display: grid; gap: 6px; }
.arena > div b { font: 400 20px var(--fd); color: var(--ink); }
.big-mon { display: grid; place-items: center; }
.big-mon .monstro { width: 130px; }
.monstro.hit { animation: golpe .6s ease-out 1; }
@keyframes golpe { 0% { transform: none; filter: none; } 20% { transform: translateX(-10px) rotate(-6deg); filter: brightness(2.2); } 45% { transform: translateX(8px) rotate(4deg); } 100% { transform: none; filter: none; } }
.monstro.ri { animation: risada .45s ease-in-out 3; }
@keyframes risada { 50% { transform: translateY(-8px) scale(1.04); } }
.monstro.caido { transform: rotate(-12deg); filter: grayscale(.5) brightness(.8); }
.rel-fr .monstro { width: 140px; }
.lab-bg { gap: 1vw; opacity: .16; align-items: flex-end; }
.lab-bg .monstro { width: min(16vw, 170px); }
@media (prefers-reduced-motion: reduce) { .monstro, .monstro * { animation: none !important; } }
.px, .opt-v { font-family: var(--fb); font-weight: 800; letter-spacing: .01em; }
.opt-v { font-size: 18px; }
.lab-bg { opacity: .1; }

[hidden]{display:none!important}
</style>

<div id="app"></div>

function chips(vals, cap, unit) {
  return `<figure class="viz"><div class="chips">${vals.map((v, i) => `<span class="chip"><small>${cap ? cap(i) : i + 1}</small><b>${fmt(v)}${unit || ''}</b></span>`).join('')}</div></figure>`;
}
function bars(cats, freqs, xl, yl) {
  const W = 340; const H = 190; const L = 34; const B = 34; const T = 14; const R = 8;
  const mx = Math.max(...freqs); const top = Math.max(4, mx + (mx % 2 ? 1 : 2));
  const bw = (W - L - R) / cats.length;
  const y = (v) => H - B - (v / top) * (H - B - T);
  let g = '';
  for (let v = 0; v <= top; v += top > 10 ? 2 : 1) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${v}</text>`;
  cats.forEach((c, i) => {
    const x = L + i * bw + bw * 0.18; const w = bw * 0.64;
    g += `<rect x="${x}" y="${y(freqs[i])}" width="${w}" height="${H - B - y(freqs[i])}" rx="3" class="bar"/><text x="${x + w / 2}" y="${y(freqs[i]) - 5}" class="bv" text-anchor="middle">${freqs[i]}</text><text x="${x + w / 2}" y="${H - B + 16}" class="ax" text-anchor="middle">${c}</text>`;
  });
  return `<figure class="viz"><svg viewBox="0 0 ${W} ${H + 4}" role="img" aria-label="Gráfico de barras: ${esc(yl)} por ${esc(xl)}">${g}<text x="${(L + W) / 2}" y="${H + 2}" class="axt" text-anchor="middle">${xl}</text><text x="10" y="${(H - B) / 2 + 10}" class="axt" text-anchor="middle" transform="rotate(-90 10 ${(H - B) / 2 + 10})">${yl}</text></svg></figure>`;
}

const trim = (p) => { let i = 0; while (i < p.length - 1 && p[i] === 0) i++; return p.slice(i); };

function altsQ(q, r, erros) {
  const f = (Q, R) => `Q(x) = ${ptex(Q)} e R = ${neg(R)}`; const certa = f(q, r); const out = [];
  erros.concat([[q, r + 1], [q, r - 2], [padd(q, [0, 1]), r], [q, r + 3], [padd(q, [0, -1]), r]]).forEach(([Q, R]) => { const v = f(Q, R); if (out.length < 4 && v !== certa && !out.includes(v)) out.push(v); });
  return { certa, outras: out };
}
const PX = (s) => `<span class="px">${s}</span>`;
// 5 alternativas de polinômio: a certa + erros (sem repetir)
function altsP(t, certa, erros) {
  const seen = new Set([pkey(certa)]); const out = [];
  const add = (p) => { p = trim(p); const k = pkey(p); if (out.length < 4 && !seen.has(k)) { seen.add(k); out.push(p); } };
  erros.forEach(add);
  for (let g = 0; out.length < 4 && g < 60; g++) { const p = certa.slice(); const i = t.ri(0, p.length - 1); p[i] += t.pick([-2, -1, 1, 2, 3]); add(p); }
  return { certa, outras: out };
}
function altsS(t, certa, erros) {
  const seen = new Set([setKey(certa)]); const out = [];
  const add = (s) => { const k = setKey(s); if (out.length < 4 && s.length && !seen.has(k)) { seen.add(k); out.push(s); } };
  erros.forEach(add);
  for (let g = 0; out.length < 4 && g < 60; g++) { const s = certa.slice(); const i = t.ri(0, s.length - 1); s[i] = t.pick([-s[i], s[i] + 1, s[i] - 1]); add(s); }
  return { certa, outras: out };
}

const nz = (t, a, b) => { let v; do { v = t.ri(a, b); } while (v === 0); return v; };
function raizesDistintas(t, n, excl, lo, hi) { const out = []; while (out.length < n) { const r = nz(t, lo, hi); if (!out.includes(r) && !excl.includes(r)) out.push(r); } return out; }

function newGame(name, turma) {
  const seed = (Date.now() ^ fnv(name + turma)) >>> 0;
  S = { name, turma, seed, e: {}, salaAt: {}, pre: {}, t0: Date.now(), finished: false, saidas: 0, foraSeg: 0 };
  S.sid = `${slugOf(name)}-${turma.toLowerCase()}-${seed.toString(36)}`;

}
const qOf = (k) => ENIGMAS[k].gen(rngTools(mulberry((S.seed + k * 7919) >>> 0)));
const salaOf = (k) => FASES[Math.floor(k / 6)];
const ks = (n) => [0, 1, 2, 3, 4, 5].map((j) => (n - 1) * 6 + j);
const st = (k) => S.e[k] || { tries: 0 };
const done = (k) => { const x = S.e[k]; return !!x && (x.ok || x.tries >= 2); };
const salaFeita = (n) => ks(n).every(done);
const salaAberta = (n) => !!(S.salaAt && S.salaAt[n]);
const salaAtual = () => { for (let n = 1; n <= 5; n++) if (!salaAberta(n)) return n; return 5; };

const dePrimeira = () => Object.values(S.e).filter((x) => x.ok && x.tries === 1).length;
const ptsOf = (k) => { const x = S.e[k]; return x && x.ok ? (x.tries === 1 ? 100 : 50) : 0; };
const ptsSala = (n) => sum(ks(n).map(ptsOf));

function certCode() { const base = `${norm(S.name)}|${S.turma}|${pontos()}|${minRest()}|g9-raiz`; return (fnv(base) % 46656).toString(36).toUpperCase().padStart(3, '0') + '-' + (fnv(base + '#') % 46656).toString(36).toUpperCase().padStart(3, '0'); }
const valTxt = (q, v) => `${neg(v)}${q.unit ? ' ' + q.unit : ''}`;
const resp = (q) => opcoesOf(cur).find((o) => o.ok).t;
const LETRAS = ['A', 'B', 'C', 'D', 'E'];
// 5 alternativas: a certa, erros típicos da questão (q.erros), ×3 / ÷3 e valores próximos
function opcoesOf(k) {
  const q = qOf(k); const t = rngTools(mulberry((S.seed + k * 7919 + 101) >>> 0)); let items;
  if (q.alt) items = [{ t: ptex(q.alt.certa), ok: true }].concat(q.alt.outras.map((p) => ({ t: ptex(p), ok: false })));
  else if (q.sets) items = [{ t: setTxt(q.sets.certa), ok: true }].concat(q.sets.outras.map((s2) => ({ t: setTxt(s2), ok: false })));
  else if (q.txt) items = [{ t: q.txt.certa, ok: true }].concat(q.txt.outras.map((s2) => ({ t: s2, ok: false })));
  else {
    const a = r2(q.ans); const seen = new Set([a]); const out = [];
    const add = (v) => { v = Math.round(v); if (out.length < 4 && !seen.has(v) && Number.isFinite(v)) { seen.add(v); out.push(v); } };
    (q.erros || []).forEach(add); t.shuffle([a + 1, a - 1, a + 2, a - 2, a + 3, a - 3, a + 5]).forEach(add);
    items = [{ t: valTxt(q, a), ok: true }].concat(out.map((v) => ({ t: valTxt(q, v), ok: false })));
  }
  return t.shuffle(items.slice(0, 5));
}

  return `<main class="page">${hud()}<div class="wrap"><section class="card">
    <h2>Área do professor</h2>
    <div class="tcards"><div><h3>Modo projeção</h3><p>Mostra o botão “Mostrar resposta” em cada questão e desliga a tela cheia, para resolver com a turma no projetor.</p><button class="btn hot" data-act="proj">${projection ? 'Desligar' : 'Ligar'} projeção</button></div>
    <div><h3>Como funciona</h3><p>Cada aluno recebe polinômios sorteados, sempre com 5 alternativas como na avaliação. São 2 tentativas por questão: 100 pontos de primeira, 50 na segunda e 0 se errar as duas, com a resolução logo em seguida. As alternativas erradas são os erros do checklist da prova.</p></div></div>
    <h3 class="live-h"><span class="dot on"></span> Turma ao vivo</h3>
    <div id="prof-live"></div>
    <details class="local"><summary>Caçadas terminadas neste aparelho</summary>${TURMAS.map((t) => `<h3>${t}</h3>${hallList(sortedHall().filter((h) => h.turma === t))}`).join('')}</details>
    <div class="row"><button class="btn ghost" data-act="${S ? (S.finished ? 'final' : 'mapa') : 'cover'}">← Voltar</button><button class="btn ghost danger" data-act="wipe">Apagar caçada atual e histórico deste aparelho</button></div>
  </section></div></main>`;
}
function modalView() {
  let inner = '';
  if (modal.type === 'pin') inner = `<h3>Área do professor</h3><form data-form="pin" autocomplete="off"><label class="fld"><span>Senha</span><input name="pin" type="password" required></label>${modal.err ? '<p class="err">Senha incorreta.</p>' : ''}<div class="row"><button class="btn hot" type="submit">Entrar</button><button class="btn ghost" type="button" data-act="close">Cancelar</button></div></form>`;
  if (modal.type === 'dossie') { const f = FASES[modal.n - 1]; inner = `<h3>Grimório · ${f.tema}</h3><div class="quadro">${f.prelecao}</div><div class="row"><button class="btn hot" data-act="close">Voltar</button></div>`; }
  if (modal.type === 'menu') inner = `<h3>Menu</h3><div class="menu">${S ? `<button class="btn ghost" data-act="mapa">Mapa da caçada</button>` : ''}<button class="btn ghost" data-act="cover">Tela inicial</button><button class="btn ghost" data-act="hall">Caçadores deste aparelho</button><button class="btn ghost" data-act="pin">Área do professor</button><button class="btn ghost" data-act="close">Fechar</button></div>`;
  return `<div class="veil" data-act="close-veil"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
}

/* ---------- render ---------- */
function render() {
  stopProf(); clearKeyHandlers(); kp = null;
  if (S && S.finished && ['mapa', 'pre'].includes(screen)) screen = 'final';
  const V = { cover: coverView, mapa: mapaView, pre: preView, sala: salaView, enigma: enigmaView, aberta: abertaView, final: finalView, hall: hallView, teacher: teacherView }[screen] || coverView;
  $app.innerHTML = V() + '<div class="toast" id="toast" role="status"></div>' + (modal ? modalView() : '');
  document.body.dataset.screen = screen; document.body.classList.toggle('proj', projection);
  mount(); shake = false;
  syncFull();
  const prev = onlineWhere;
  onlineWhere = !S ? '' : screen === 'enigma' ? `Questão ${cur % 6 + 1} · ${ENIGMAS[cur].nome}` : screen === 'sala' ? `Na fase ${salaV}` : screen === 'pre' ? `Lendo o grimório ${salaV}` : screen === 'aberta' ? `Venceu a fase ${salaV}` : 'No mapa';
  if (S && !S.finished && onlineWhere !== prev && ['enigma', 'sala', 'pre', 'mapa', 'aberta'].includes(screen)) syncPost([], true);
  if (!hbTimer) heartbeat();
  if (screen === 'aberta') fillPodium(document.getElementById('podio'), salaV - 1, 'sol', 10);
  if (screen === 'final') fillPodium(document.getElementById('podio'), 0, 'final', 50);
  if (screen === 'teacher') startProf();
}
function mount() {
  if (screen === 'enigma' && S && !done(cur)) {
    const kb = (e) => {
      if (document.querySelector('.veil') || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'Enter') { e.preventDefault(); send(); return; }
      const i = LETRAS.indexOf(e.key.toUpperCase()); const n = '12345'.indexOf(e.key); const j = i >= 0 ? i : n;
      if (j >= 0) { const b = document.querySelector(`.opt[data-i="${j}"]`); if (b && !b.disabled) { e.preventDefault(); pick = j; render(); } }
    };
    document.addEventListener('keydown', kb); KEYHANDLERS.push(() => document.removeEventListener('keydown', kb));
  }
  if (screen === 'enigma' && done(cur)) { const r = document.querySelector('.result'); if (r && innerWidth < 820) setTimeout(() => r.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }), 60); }
  const f = document.querySelector('[data-autofocus]'); if (f && screen !== 'enigma') f.focus({ preventScroll: true });
}
const go = (s) => { screen = s; modal = null; render(); window.scrollTo(0, 0); };

/* ---------- ações ---------- */
function send() {
  if (!S || S.finished || done(cur)) return;
  if (pick == null) { toast('Escolha uma alternativa.'); return; }
  const ops = opcoesOf(cur); const o = ops[pick]; const ok = o.ok;
  const x = S.e[cur] || { tries: 0, v: [] }; x.tries++; x.v = (x.v || []).concat(`${LETRAS[pick]}) ${o.t}`); x.ok = ok; x.at = Date.now();
  if (!ok) x.bad = (x.bad || []).concat(pick); S.e[cur] = x; pick = null;
  const f = salaOf(cur); const evs = [];
  if (ok) evs.push({ ev: 'Acertou', det: `Fase ${f.n} · ${ENIGMAS[cur].nome}${x.tries === 2 ? ' (2ª tentativa)' : ''}`, pts: ptsOf(cur) });
  else if (x.tries >= 2) evs.push({ ev: 'Escapou', det: `Fase ${f.n} · ${ENIGMAS[cur].nome}`, pts: 0 });
  else evs.push({ ev: 'Errou', det: `Fase ${f.n} · ${ENIGMAS[cur].nome}`, pts: 0 });
  save(); syncEv(evs);
  if (!ok) { shake = true; try { if (navigator.vibrate) navigator.vibrate([20, 40, 20]); } catch (e) { /* */ } }
  reveal = false; render();
  if (!ok && x.tries < 2) toast('Alternativa errada. Você tem mais uma tentativa.');
}
function concluir() {
  const n = salaOf(cur).n; salaV = n; if (!salaFeita(n)) return;
  if (!salaAberta(n)) {
    S.salaAt[n] = Date.now();
    const evs = [{ ev: 'Venceu a fase', det: `Fase ${n} · ${FASES[n - 1].nome}`, pts: ptsSala(n) }];
    if (n === 5) {
      S.finished = true; S.t1 = Date.now();
      DB.hall.push({ name: S.name, turma: S.turma, pts: pontos(), min: acertos(), rank: rankLabel(), t: Date.now() }); if (DB.hall.length > 200) DB.hall = sortedHall().slice(0, 200);
      evs.push({ ev: 'Concluiu a caçada', det: `${rankLabel()} · ${acertos()} acertos`, pts: pontos() });
    }
    save(); syncEv(evs);
  }
  go('aberta');
}
function irSala(n) {
  if (!S) return; n = Math.max(1, Math.min(5, n));
  if (n > salaAtual() && !salaAberta(n)) { toast('Essa fase ainda está trancada.'); return; }
  salaV = n;
  if (!S.pre[n] && !salaAberta(n)) { S.pre[n] = true; save(); go('pre'); } else go('sala');
}
function copyResult() {
  const txt = `Caçadores de Raízes · Polinômios (2º ano)\n${S.name} · ${S.turma}\nNível: ${rankLabel()}\nPontos: ${pontos()} de 3000 · De primeira: ${dePrimeira()}/30 · Acertos: ${acertos()}/30\nPor fase: ${FASES.map((f) => `${f.nome} ${ptsSala(f.n)}`).join(' · ')}\nSaídas da tela: ${foraTxt()}\nCódigo de verificação: ${certCode()}`;
  const fall = () => { const b = document.getElementById('copy-box'); b.hidden = false; b.value = txt; b.select(); toast('Copie o texto selecionado.'); };
  try { navigator.clipboard.writeText(txt).then(() => toast('Resultado copiado. Agora é só colar e enviar.'), fall); } catch (e) { fall(); }
}

$app.addEventListener('click', (e) => {
  const veil = e.target.closest('[data-act="close-veil"]'); if (veil && e.target === veil) { const keep = kp ? kp.raw() : null; modal = null; render(); if (kp && keep) kp.set(keep); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'mapa') { if (S) go(S.finished ? 'final' : 'mapa'); else go('cover'); }
  else if (a === 'cover') go('cover');
  else if (a === 'sala') irSala(+b.dataset.n);
  else if (a === 'locked') toast('Essa fase ainda está trancada. Vença a anterior primeiro.');
  else if (a === 'enigma') { cur = +b.dataset.k; reveal = false; pick = null; go('enigma'); }
  else if (a === 'send') send();
  else if (a === 'pick') { pick = +b.dataset.i; render(); }
  else if (a === 'concluir') concluir();
  else if (a === 'final') { if (S && S.finished) go('final'); }
  else if (a === 'dossie') { const keep = kp ? kp.raw() : null; modal = { type: 'dossie', n: +b.dataset.n }; render(); if (kp && keep) kp.set(keep); }
  else if (a === 'reveal') { reveal = true; const keep = kp ? kp.raw() : null; render(); if (kp && keep) kp.set(keep); }
  else if (a === 'hall') go('hall');
  else if (a === 'pin') { modal = { type: 'pin' }; render(); setTimeout(() => { const i = document.querySelector('.modal input'); if (i) i.focus(); }, 30); }
  else if (a === 'menu') { modal = { type: 'menu' }; render(); }
  else if (a === 'close') { const keep = kp ? kp.raw() : null; modal = null; render(); if (kp && keep) kp.set(keep); }
  else if (a === 'proj') { projection = !projection; render(); }
  else if (a === 'prof-filtro') { prof.filtro = b.dataset.id; renderProf(); }
  else if (a === 'prof-aba') { prof.aba = b.dataset.id; renderProf(); }
  else if (a === 'prof-pod') { prof.pod = +b.dataset.i; renderProf(); }
  else if (a === 'copy') copyResult();
  else if (a === 'again') { DB.cur = null; S = null; save(); go('cover'); }
  else if (a === 'wipe') { if (confirm('Apagar a caçada atual e o histórico deste aparelho?')) { DB = { cur: null, hall: [] }; S = null; save(); go('cover'); } }
});
$app.addEventListener('submit', (e) => {
  e.preventDefault(); const f = e.target;
  if (f.dataset.form === 'start') {
    const name = f.nome.value.trim().replace(/\s+/g, ' '); const t = f.querySelector('input[name=turma]:checked');
    const err = document.getElementById('f-err');
    if (name.split(' ').length < 2) { err.textContent = 'Digite nome e sobrenome.'; err.hidden = false; return; }
    if (!t) { err.textContent = 'Escolha sua turma.'; err.hidden = false; return; }
    newGame(name, t.value); irSala(1);
  }
  if (f.dataset.form === 'pin') { if (fnv('missao:' + norm(f.pin.value)) === PIN_HASH) { teacherKey = norm(f.pin.value); modal = null; go('teacher'); } else { modal = { type: 'pin', err: true }; render(); } }
});
render();

})();
</script>
</body>
</html>
