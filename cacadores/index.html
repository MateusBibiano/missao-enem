<style>
:root { font-synthesis-weight: none;
  /* Arcade synthwave em pixel art: céu roxo, grade magenta, ciano do caçador, amarelo dos pontos */
  --bg: #0D0221; --bg2: #150734; --box: #1B0B45; --box2: #241058; --line: #3A2E8C; --ink: #F6F1E7; --mute: #B9ADE6; --dim: #7D70B8;
  --cyan: #2DE2E6; --mag: #FF3864; --yel: #F9C80E; --grn: #3EE07A;
  --px: "Tiny5", ui-monospace, monospace; --fb: "Lexend", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--fb); }
body { min-height: 100vh; background: radial-gradient(800px 400px at 50% -10%, rgba(255, 56, 100, .18), transparent 65%), linear-gradient(180deg, #0D0221, #150734 60%, #0D0221); }
body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 90; background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--yel); outline-offset: 3px; }
.muted { color: var(--mute); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 16px; }
.row.center, .center .row { justify-content: center; }
.row.sm { gap: 18px; margin-top: 8px; }
.center { text-align: center; }
.err { margin: 0; color: #FFC2CC; background: rgba(255, 56, 100, .15); border: 2px solid var(--mag); padding: 8px 12px; font-size: 15px; }
.warn { color: var(--mag); }
.ok { color: var(--grn); }
h2 { font: 700 clamp(24px, 2.6vw, 33px)/1.4 var(--px); margin: 4px 0 14px; text-wrap: balance; }
h3 { font: 700 18px/1.6 var(--px); margin: 18px 0 10px; letter-spacing: .04em; }
.kick { font: 700 15px/1.6 var(--px); color: var(--fc, var(--yel)); letter-spacing: .06em; margin: 0 0 8px; }
.link { background: none; border: 0; color: var(--cyan); text-decoration: underline; text-underline-offset: 4px; padding: 4px 0; font-size: 15px; }

/* caixas com borda em degraus de pixel */
.pbox { position: relative; background: var(--box); padding: 20px; margin: 4px; box-shadow: 0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink), -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink), 0 0 0 4px var(--bg), 8px 8px 0 4px rgba(0,0,0,.45); }
.pbox[style*="--fc"] { box-shadow: 0 -4px 0 0 var(--fc), 0 4px 0 0 var(--fc), -4px 0 0 0 var(--fc), 4px 0 0 0 var(--fc), 0 0 0 4px var(--bg), 8px 8px 0 4px rgba(0,0,0,.45); }
.pbtn { font: 700 18px/1.4 var(--px); letter-spacing: .04em; padding: 14px 18px; background: var(--box2); color: var(--ink); border: 0; box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink), inset -4px -4px 0 0 rgba(0,0,0,.35); transition: transform .08s; margin: 3px; }
.pbtn:hover:not(:disabled) { transform: translate(-1px, -2px); }
.pbtn:active:not(:disabled) { transform: translate(1px, 2px); box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink), inset 4px 4px 0 0 rgba(0,0,0,.35); }
.pbtn.hot { background: var(--yel); color: #1A0E00; }
.pbtn.big { padding: 16px 22px; font-size: 13px; }
.pbtn.wide { width: calc(100% - 6px); }
.pbtn.danger { color: #FFC2CC; }
.pbtn:disabled { opacity: .45; cursor: not-allowed; }

/* HUD */
.hud { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(13, 2, 33, .94); border-bottom: 4px solid var(--line); }
.brand { background: none; border: 0; padding: 0; text-align: left; font: 700 18px/1.3 var(--px); color: var(--yel); display: grid; }
.brand span { color: var(--cyan); font-size: 9px; }
.cells { margin-left: auto; display: flex; gap: 6px; }
.cells div { display: grid; text-align: center; padding: 2px 10px; border-left: 3px solid var(--line); }
.cells small { font: 700 12px var(--px); color: var(--dim); }
.cells b { font: 700 20px/1.6 var(--px); color: var(--yel); }
.ibtn { width: 40px; height: 40px; background: var(--box2); border: 0; color: var(--ink); box-shadow: 0 0 0 3px var(--line); display: grid; place-items: center; font-size: 18px; }
.pxi { width: 20px; height: 20px; }
.proj { font: 700 14px var(--px); background: var(--mag); color: #fff; padding: 6px 8px; }
@media (max-width: 600px) { .hud { flex-wrap: wrap; } .cells { order: 4; width: 100%; margin: 0; justify-content: space-between; } .cells div { flex: 1; border-left: 0; } .hide-s { display: none !important; } .brand { margin-right: auto; } }

/* capa */
.cover { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 30px 16px 40px; overflow: hidden; }
.cv-cover { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.crt { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55)); pointer-events: none; }
.cover-in { position: relative; width: min(560px, 100%); text-align: center; }
.tag { font: 700 14px/1.8 var(--px); color: var(--mute); margin: 0 0 18px; }
.logo-t { margin: 0; display: grid; gap: 10px; font: 700 clamp(39px, 7.5vw, 72px)/1.1 var(--px); }
.logo-t span:first-child { color: var(--yel); text-shadow: 4px 4px 0 var(--mag), 8px 8px 0 #0D0221; }
.logo-t span:last-child { color: var(--cyan); font-size: .62em; text-shadow: 3px 3px 0 #0D0221; }
.blink { font: 700 15px/1.8 var(--px); color: var(--mag); margin: 18px 0 8px; animation: pisca 1.1s steps(2) infinite; }
@keyframes pisca { 50% { opacity: .15; } }
.lede { color: var(--mute); text-shadow: 0 2px 0 #0D0221; }
.lede b { color: var(--yel); }
.resume { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin: 14px 0; padding: 12px; background: rgba(13,2,33,.8); border: 3px solid var(--grn); }
.crew { text-align: left; display: grid; gap: 14px; margin-top: 18px; background: rgba(27, 11, 69, .92); }
.fld { display: grid; gap: 6px; }
.fld span, .seg legend { font: 700 14px var(--px); color: var(--mute); }
.fld input { background: #0D0221; color: var(--ink); border: 0; box-shadow: 0 0 0 3px var(--line); padding: 12px; font: 16px var(--fb); }
.fld input:focus { box-shadow: 0 0 0 3px var(--cyan); outline: none; }
.seg { border: 0; padding: 0; margin: 0; display: flex; gap: 10px; }
.seg legend { margin-bottom: 8px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: inline-block; font: 700 18px var(--px); padding: 12px 16px; background: #0D0221; box-shadow: 0 0 0 3px var(--line); }
.seg input:checked + span { background: var(--cyan); color: #0D0221; box-shadow: 0 0 0 3px var(--cyan); }
.seg input:focus-visible + span { outline: 3px solid var(--yel); outline-offset: 3px; }
.links { display: flex; justify-content: center; gap: 20px; margin-top: 16px; }

/* páginas */
.wrap { width: min(980px, calc(100% - 32px)); margin: 22px auto 50px; display: grid; gap: 22px; }
.trilha { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; position: relative; }
.trilha::before { content: ''; position: absolute; left: 44px; top: 20px; bottom: 20px; border-left: 4px dashed var(--line); }
.no button { position: relative; width: 100%; display: grid; grid-template-columns: 72px 1fr auto; align-items: center; gap: 14px; padding: 10px 14px; text-align: left; background: var(--box2); border: 0; box-shadow: 0 0 0 3px var(--line); }
.no.atual button { box-shadow: 0 0 0 3px var(--fc), 0 0 22px 2px color-mix(in srgb, var(--fc) 45%, transparent); animation: chama 1.6s ease-in-out infinite; }
@keyframes chama { 50% { box-shadow: 0 0 0 3px var(--fc), 0 0 6px 0 color-mix(in srgb, var(--fc) 30%, transparent); } }
.no.feito button { box-shadow: 0 0 0 3px var(--grn); }
.no.tranc button { opacity: .5; cursor: not-allowed; }
.no-mon { width: 56px; height: 56px; display: grid; place-items: center; background: #0D0221; box-shadow: 0 0 0 3px var(--line); }
.no-mon canvas { width: 48px; height: 48px; image-rendering: pixelated; }
.no.atual .no-mon canvas { animation: pula .6s steps(2) infinite; }
@keyframes pula { 50% { transform: translateY(-3px); } }
.no.feito .no-mon canvas { filter: grayscale(1) brightness(.6); }
.no-t { display: grid; gap: 2px; }
.no-t small { font: 700 12px var(--px); color: var(--fc); }
.no-t b { font: 700 18px/1.5 var(--px); }
.no-t span { font-size: 14px; color: var(--mute); }
.no-st { font: 700 16px var(--px); color: var(--yel); }
@media (max-width: 520px) { .no button { grid-template-columns: 56px 1fr auto; gap: 10px; } .trilha::before { left: 36px; } }

/* arena */
.arena-box { padding: 0; overflow: hidden; }
.arena { display: block; width: 100%; height: clamp(190px, 32vw, 300px); image-rendering: pixelated; background: #0D0221; }
.arena-hud { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; font: 700 14px var(--px); background: #0D0221; color: var(--mute); }
.arena-hud span:last-child { color: var(--mag); letter-spacing: 2px; }
.intro .arena { margin: -20px -20px 16px; width: calc(100% + 40px); height: clamp(170px, 26vw, 240px); }
.aparece { animation: aparece .5s steps(5); color: var(--fc, var(--yel)); }
@keyframes aparece { from { transform: scale(1.6); opacity: 0; } }
.grim summary { cursor: pointer; font: 700 15px var(--px); color: var(--cyan); margin: 10px 0; }
.quadro { background: #0D0221; padding: 14px 16px; box-shadow: 0 0 0 3px var(--line); }
.quadro p { margin: 0 0 10px; } .quadro ul { margin: 0 0 10px; padding-left: 20px; }
.formula { font: 700 17px var(--fb); color: var(--yel); text-align: center; padding: 10px; background: rgba(255,255,255,.04); margin: 8px 0 12px; }

/* diálogo da questão */
.dialogo .ctx { margin: 0 0 6px; font-size: 18px; }
.ask { font-size: 18px; margin: 12px 0 16px; padding: 10px 14px; border-left: 6px solid var(--fc); background: rgba(255,255,255,.04); }
.px { font-weight: 700; white-space: nowrap; background: rgba(45, 226, 230, .1); color: #CFFAFB; padding: 1px 6px; }
.px sup, .opt-v sup { font-size: .7em; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.opts .opt:last-child:nth-child(odd) { grid-column: 1 / -1; }
@media (max-width: 640px) { .opts { grid-template-columns: 1fr; } }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; background: var(--box2); color: var(--ink); border: 0; box-shadow: 0 0 0 3px var(--line), 4px 4px 0 3px rgba(0,0,0,.4); animation: entra .35s var(--d) both steps(4); transition: transform .08s; }
@keyframes entra { from { transform: translateX(-24px); opacity: 0; } }
.opt:hover:not(:disabled) { box-shadow: 0 0 0 3px var(--cyan), 4px 4px 0 3px rgba(0,0,0,.4); transform: translate(-1px, -1px); }
.opt-l { flex: none; width: 34px; height: 34px; display: grid; place-items: center; font: 700 18px var(--px); background: #0D0221; box-shadow: 0 0 0 2px var(--line); }
.opt-v { font: 700 18px/1.35 var(--fb); }
.opt.on { background: #12405A; box-shadow: 0 0 0 3px var(--cyan), 0 0 18px 2px rgba(45,226,230,.35); }
.opt.on .opt-l { background: var(--cyan); color: #0D0221; }
.opt.riscada { opacity: .4; cursor: not-allowed; }
.opt.riscada .opt-v { text-decoration: line-through 3px var(--mag); }
.opt.riscada .opt-l { background: var(--mag); color: #fff; }
.opt.acerto { animation: brilho .5s steps(3) 2; }
.opt.erro { animation: treme .3s 2; }
@keyframes brilho { 50% { background: var(--grn); color: #0D0221; } }
@keyframes treme { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.fire { margin-top: 18px; }
.hint { font-size: 14px; color: var(--mute); margin: 10px 0 0; }
.res { margin-top: 6px; }
.res-t { font: 700 clamp(21px, 3vw, 30px)/1.4 var(--px); margin: 0 0 10px; animation: aparece .4s steps(4); }
.res.win .res-t { color: var(--grn); text-shadow: 3px 3px 0 #0D0221; }
.res.lose .res-t { color: var(--mag); text-shadow: 3px 3px 0 #0D0221; }
.sol { background: #0D0221; padding: 12px 16px; margin-top: 12px; box-shadow: 0 0 0 3px var(--line); }
.passos { margin: 0; padding-left: 22px; } .passos li { margin: 6px 0; }
.ruff { display: inline-grid; gap: 2px; margin: 6px 0; }
.ruff table { border-collapse: collapse; font: 700 16px var(--fb); }
.ruff td { padding: 4px 12px; text-align: center; min-width: 34px; }
.ruff tr:first-child td { border-bottom: 3px solid var(--mute); }
.ruff td.ra { border-right: 3px solid var(--mute); color: var(--yel); }
.ruff td.rr { color: var(--yel); outline: 3px solid var(--yel); outline-offset: -3px; }
.passos li .ruff { display: grid; }

/* placar e finais */
.placar { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 16px 0; }
.placar div { background: #0D0221; padding: 12px; box-shadow: 0 0 0 3px var(--line); display: grid; gap: 6px; }
.placar small { font: 700 12px var(--px); color: var(--mute); }
.placar b { font: 700 33px var(--px); color: var(--yel); }
.rank { font: 700 20px var(--px); color: var(--cyan); margin: 0 0 6px; }
.porfase { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 10px 0 16px; }
.porfase div { padding: 10px; background: #0D0221; box-shadow: 0 0 0 3px var(--fc); display: grid; gap: 4px; }
.porfase b { font: 700 24px var(--px); color: var(--fc); }
.porfase span { font-size: 13px; color: var(--mute); }
@media (max-width: 640px) { .porfase { grid-template-columns: 1fr 1fr; } }
.copy-box { width: 100%; min-height: 150px; margin-top: 10px; background: #0D0221; color: var(--ink); border: 0; box-shadow: 0 0 0 3px var(--line); padding: 10px; font: 14px var(--fb); }
.podium { list-style: none; padding: 0; margin: 10px auto 0; max-width: 560px; text-align: left; display: grid; gap: 8px; }
.podium li { display: grid; grid-template-columns: 40px 1fr auto auto; align-items: center; gap: 10px; padding: 8px 12px; background: #0D0221; box-shadow: 0 0 0 3px var(--line); }
.podium li.top { box-shadow: 0 0 0 3px var(--yel); }
.podium li.me { background: #2A1A00; box-shadow: 0 0 0 3px var(--cyan); }
.p-n { font: 700 18px var(--px); text-align: center; }
.p-t { font: 700 14px var(--px); color: var(--mute); }
.p-r { grid-column: 2 / 4; font-size: 13px; color: var(--mute); order: 5; }
.p-p { font: 700 20px var(--px); color: var(--yel); }
.p-p small { font-size: 8px; color: var(--mute); }
.p-mine { text-align: center; font-size: 15px; }
.hall { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.hall li { display: grid; grid-template-columns: 36px 1fr auto; gap: 4px 10px; padding: 8px 10px; background: #0D0221; align-items: center; }
.hall li > span:nth-child(3) { grid-column: 2; font-size: 13px; color: var(--mute); }
.h-n { font: 700 16px var(--px); color: var(--dim); grid-row: span 2; }
.h-p { font: 700 20px var(--px); color: var(--yel); grid-row: 1; grid-column: 3; }

/* professor */
.tcards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tcards > div { background: #0D0221; padding: 14px; box-shadow: 0 0 0 3px var(--line); }
.tcards h3 { margin-top: 0; }
@media (max-width: 680px) { .tcards { grid-template-columns: 1fr; } }
.live-h { display: flex; align-items: center; gap: 8px; }
.dot { display: inline-block; width: 10px; height: 10px; background: var(--dim); }
.dot.on { background: var(--grn); animation: pisca 1.2s steps(2) infinite; }
.dot.fim { background: var(--yel); }
.prof-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.seg-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.seg-tabs button { background: var(--box2); border: 0; box-shadow: 0 0 0 2px var(--line); padding: 8px 12px; font: 700 14px var(--px); }
.seg-tabs button.on { background: var(--yel); color: #1A0E00; }
.live-tag { font-size: 13px; display: flex; gap: 6px; align-items: center; }
.tscroll { overflow-x: auto; }
table.live { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px; }
.live th { font: 700 12px var(--px); color: var(--dim); text-align: left; padding: 8px; border-bottom: 3px solid var(--line); }
.live td { padding: 8px; border-bottom: 2px solid var(--line); vertical-align: top; }
.live td small { display: block; color: var(--mute); font-size: 12px; }
.live td.num { text-align: right; font-weight: 700; }
.live tr.on td { background: rgba(62, 224, 122, .06); }
.feed-h { margin-top: 18px; }
.feed { list-style: none; padding: 0; margin: 0; font-size: 14px; max-height: 340px; overflow: auto; }
.feed li { padding: 6px 0; border-bottom: 2px solid var(--line); }
.local { margin-top: 18px; } .local summary { cursor: pointer; color: var(--mute); }
.pulse { animation: pisca 1.2s steps(2) infinite; }

/* modal, toast, alerta */
.veil { position: fixed; inset: 0; z-index: 50; background: rgba(13, 2, 33, .8); display: grid; place-items: center; padding: 16px; }
.modal { width: min(560px, 100%); max-height: calc(100vh - 40px); overflow: auto; }
.modal h3 { margin-top: 0; }
.menu { display: grid; gap: 10px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 150%); background: var(--yel); color: #1A0E00; padding: 12px 16px; font: 700 15px/1.6 var(--px); z-index: 60; transition: transform .2s steps(3); max-width: calc(100% - 32px); box-shadow: 0 0 0 3px #0D0221; visibility: hidden; }
.toast.on { transform: translate(-50%, 0); visibility: visible; }
#guard { position: fixed; inset: 0; z-index: 80; background: rgba(13, 2, 33, .95); display: grid; place-items: center; padding: 16px; }
.guard-box { width: min(480px, 100%); text-align: center; background: var(--box); padding: 24px; box-shadow: 0 0 0 4px var(--mag); }
.guard-ic { font-size: 40px; color: var(--mag); }
.guard-box small { display: block; font: 700 14px var(--px); color: var(--mag); }
.guard-box h2 { margin-top: 10px; }
.guard-box dl { display: flex; justify-content: center; gap: 24px; margin: 14px 0; }
.guard-box dt { font: 700 12px var(--px); color: var(--mute); }
.guard-box dd { margin: 0; font: 700 27px var(--px); }
.guard-box .btn { font: 700 18px var(--px); padding: 14px 18px; background: var(--yel); color: #1A0E00; border: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:20px">Este jogo precisa de JavaScript.</p></noscript>

function chips(vals, cap, unit) {
  return `<figure class="viz"><div class="chips">${vals.map((v, i) => `<span class="chip"><small>${cap ? cap(i) : i + 1}</small><b>${fmt(v)}${unit || ''}</b></span>`).join('')}</div></figure>`;
}
function bars(cats, freqs, xl, yl) {
  const W = 340; const H = 190; const L = 34; const B = 34; const T = 14; const R = 8;
  const mx = Math.max(...freqs); const top = Math.max(4, mx + (mx % 2 ? 1 : 2));
  const bw = (W - L - R) / cats.length;
  const y = (v) => H - B - (v / top) * (H - B - T);
  let g = '';
  for (let v = 0; v <= top; v += top > 10 ? 2 : 1) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L - 6}" y="${y(v) + 4}" class="ax" text-anchor="end">${v}</text>`;
  cats.forEach((c, i) => {
    const x = L + i * bw + bw * 0.18; const w = bw * 0.64;
    g += `<rect x="${x}" y="${y(freqs[i])}" width="${w}" height="${H - B - y(freqs[i])}" rx="3" class="bar"/><text x="${x + w / 2}" y="${y(freqs[i]) - 5}" class="bv" text-anchor="middle">${freqs[i]}</text><text x="${x + w / 2}" y="${H - B + 16}" class="ax" text-anchor="middle">${c}</text>`;
  });
  return `<figure class="viz"><svg viewBox="0 0 ${W} ${H + 4}" role="img" aria-label="Gráfico de barras: ${esc(yl)} por ${esc(xl)}">${g}<text x="${(L + W) / 2}" y="${H + 2}" class="axt" text-anchor="middle">${xl}</text><text x="10" y="${(H - B) / 2 + 10}" class="axt" text-anchor="middle" transform="rotate(-90 10 ${(H - B) / 2 + 10})">${yl}</text></svg></figure>`;
}

const trim = (p) => { let i = 0; while (i < p.length - 1 && p[i] === 0) i++; return p.slice(i); };

function altsQ(q, r, erros) {
  const f = (Q, R) => `Q(x) = ${ptex(Q)} e R = ${neg(R)}`; const certa = f(q, r); const out = [];
  erros.concat([[q, r + 1], [q, r - 2], [padd(q, [0, 1]), r], [q, r + 3], [padd(q, [0, -1]), r]]).forEach(([Q, R]) => { const v = f(Q, R); if (out.length < 4 && v !== certa && !out.includes(v)) out.push(v); });
  return { certa, outras: out };
}
const PX = (s) => `<span class="px">${s}</span>`;
// 5 alternativas de polinômio: a certa + erros (sem repetir)
function altsP(t, certa, erros) {
  const seen = new Set([pkey(certa)]); const out = [];
  const add = (p) => { p = trim(p); const k = pkey(p); if (out.length < 4 && !seen.has(k)) { seen.add(k); out.push(p); } };
  erros.forEach(add);
  for (let g = 0; out.length < 4 && g < 60; g++) { const p = certa.slice(); const i = t.ri(0, p.length - 1); p[i] += t.pick([-2, -1, 1, 2, 3]); add(p); }
  return { certa, outras: out };
}
function altsS(t, certa, erros) {
  const seen = new Set([setKey(certa)]); const out = [];
  const add = (s) => { const k = setKey(s); if (out.length < 4 && s.length && !seen.has(k)) { seen.add(k); out.push(s); } };
  erros.forEach(add);
  for (let g = 0; out.length < 4 && g < 60; g++) { const s = certa.slice(); const i = t.ri(0, s.length - 1); s[i] = t.pick([-s[i], s[i] + 1, s[i] - 1]); add(s); }
  return { certa, outras: out };
}

const nz = (t, a, b) => { let v; do { v = t.ri(a, b); } while (v === 0); return v; };
function raizesDistintas(t, n, excl, lo, hi) { const out = []; while (out.length < n) { const r = nz(t, lo, hi); if (!out.includes(r) && !excl.includes(r)) out.push(r); } return out; }

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (base[y][x] === 'M' && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => (base[y + dy] || [])[x + dx] !== 'M')) g[y][x] = 'O';

$app.addEventListener('submit', (e) => {
  e.preventDefault(); const f = e.target;
  if (f.dataset.form === 'start') {
    const name = f.nome.value.trim().replace(/\s+/g, ' '); const t = f.querySelector('input[name=turma]:checked');
    const err = document.getElementById('f-err');
    if (name.split(' ').length < 2) { err.textContent = 'Digite nome e sobrenome.'; err.hidden = false; return; }
    if (!t) { err.textContent = 'Escolha sua turma.'; err.hidden = false; return; }
    newGame(name, t.value); irFase(1);
  }
  if (f.dataset.form === 'pin') { if (fnv('missao:' + norm(f.pin.value)) === PIN_HASH) { teacherKey = norm(f.pin.value); modal = null; go('teacher'); } else { modal = { type: 'pin', err: true }; render(); } }
});
render();

})();
</script>
</body>
</html>
