<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batalha Naval · Corpos Redondos</title>
<meta name="description" content="Batalha Naval contra o computador: cada linha do mar é uma questão da prova de cilindros, cones e esferas. Turmas M21 e M22 · Prof. Mateus Bibiano.">

<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Batalha Naval · Corpos Redondos">
<meta property="og:description" content="Batalha Naval contra o computador: cada linha do mar é uma questão da prova de cilindros, cones e esferas. Turmas M21 e M22 · Prof. Mateus Bibiano.">
<meta property="og:url" content="https://mateusbibiano.github.io/missao-enem/naval/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314365C'/%3E%3Cpath d='M10 38h44l-7 12H17z' fill='%23EEF1EA'/%3E%3Crect x='22' y='26' width='14' height='12' fill='%23EEF1EA'/%3E%3Cpath d='M30 14v12' stroke='%23C8372D' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Saira+Stencil+One&display=swap">
<style>
:root {
  --paper: #EEF1EA; --paper2: #E3E9E1; --ink: #14365C; --ink2: #47607C; --line: #B9C8CF;
  --sea: #CFE2EA; --sea2: #B7D3E0; --deep: #0F2A47; --red: #C8372D; --brass: #B8862F; --ok: #2E7D4F; --white: #FBFCF8;
  --fd: 'Saira Stencil One', 'Arial Black', sans-serif; --fb: 'Barlow', system-ui, sans-serif; --fm: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { background: var(--paper); }
body {
  color: var(--ink); font-family: var(--fb); font-size: 16px; line-height: 1.5; min-height: 100vh;
  background-color: var(--paper);
  background-image:
    radial-gradient(circle at 12% 18%, transparent 0 118px, rgba(20,54,92,.07) 119px 120px, transparent 121px 168px, rgba(20,54,92,.06) 169px 170px, transparent 171px),
    radial-gradient(circle at 88% 74%, transparent 0 98px, rgba(20,54,92,.07) 99px 100px, transparent 101px 150px, rgba(20,54,92,.06) 151px 152px, transparent 153px 210px, rgba(20,54,92,.05) 211px 212px, transparent 213px),
    linear-gradient(rgba(20,54,92,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(20,54,92,.05) 1px, transparent 1px);
  background-size: auto, auto, 80px 80px, 80px 80px; background-attachment: fixed;
}
#app { max-width: 1200px; margin: 0 auto; padding: 0 16px 48px; }
button { font: inherit; cursor: pointer; color: inherit; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--fd); font-weight: 400; line-height: 1.05; margin: 0 0 .4em; letter-spacing: .01em; }
.center { text-align: center; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.row.end { justify-content: flex-end; }
.small { font-size: 14px; color: var(--ink2); }
.eyebrow, .kick { font-family: var(--fm); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); margin: 0 0 8px; }
.lead { font-size: 18px; color: var(--ink2); max-width: 58ch; }

.btn { border: 2px solid var(--ink); border-radius: 4px; padding: 10px 18px; font-weight: 700; letter-spacing: .02em; transition: transform .08s, background .15s; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 3px 0 #8E241D; }
.btn.red:hover:not(:disabled) { background: #DA4337; }
.btn.red:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #8E241D; }
.btn.ghost { background: var(--white); }
.btn.ghost:hover:not(:disabled) { background: var(--ink); color: var(--white); }
.btn.big { font-size: 18px; padding: 13px 22px; }
.btn:disabled { opacity: .4; }
.btn.danger { border-color: var(--red); color: var(--red); }
.lnk { background: none; border: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }

.top { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 2px solid var(--ink); margin-bottom: 20px; flex-wrap: wrap; }
.top .logo { height: 34px; width: auto; }
.brand { display: grid; line-height: 1.1; }
.brand b { font-family: var(--fd); font-weight: 400; font-size: 22px; letter-spacing: .04em; }
.brand span { font-family: var(--fm); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.top-r { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.who { font-family: var(--fm); font-size: 13px; color: var(--ink2); }

/* início */
.hero { display: grid; grid-template-columns: 1fr 200px; gap: 20px; align-items: center; margin: 14px 0 22px; }
.hero h1 { font-size: clamp(40px, 7vw, 80px); }
.hero h1 span { color: var(--red); }
.rose { width: 100%; height: auto; color: var(--ink); opacity: .8; animation: drift 18s ease-in-out infinite alternate; }
@keyframes drift { to { transform: rotate(14deg); } }
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-bottom: 20px; }
.card { background: var(--white); border: 2px solid var(--ink); border-radius: 6px; padding: 16px; box-shadow: 6px 6px 0 rgba(20,54,92,.12); }
.card-h { margin: 0 0 10px; font-family: var(--fd); font-size: 20px; }
.form { display: grid; gap: 12px; }
.form label { display: grid; gap: 4px; font-weight: 700; }
input:not([type=radio]) { font: inherit; font-size: 18px; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 4px; background: #fff; color: var(--ink); }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-weight: 700; margin-bottom: 4px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg3 { grid-template-columns: repeat(3, 1fr); }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; text-align: center; padding: 9px 6px; border: 2px solid var(--ink); border-radius: 4px; font-family: var(--fm); font-weight: 600; background: #fff; }
.seg input:checked + span { background: var(--ink); color: var(--white); }
.seg input:focus-visible + span { outline: 3px solid var(--brass); }
.rowlist { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 4px; }
.rowlist li { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.rowlist b { font-family: var(--fd); font-weight: 400; font-size: 20px; color: var(--red); }
.rowlist i { font-style: normal; font-family: var(--fm); font-size: 12px; color: var(--ink2); }

/* tabuleiro */
.sea { min-width: 0; }
.sea-h { margin: 0 0 6px; font-family: var(--fm); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.grid { display: grid; grid-template-columns: minmax(46px, auto) repeat(6, minmax(0, 1fr)); gap: 3px; background: var(--ink); padding: 3px; border-radius: 6px; }
.grid .corner { background: var(--ink); }
.grid .ch { background: var(--ink); color: var(--white); font-family: var(--fm); font-weight: 600; text-align: center; font-size: 13px; padding: 2px 0; }
.grid .rh { background: var(--ink); color: var(--white); display: grid; align-content: center; padding: 0 6px; line-height: 1.05; }
.grid .rh b { font-family: var(--fd); font-weight: 400; font-size: 20px; color: #FFD27A; }
.grid .rh small { font-size: 10.5px; opacity: .85; }
.cell { position: relative; aspect-ratio: 1; border: 0; padding: 0; background: linear-gradient(160deg, var(--sea), var(--sea2)); border-radius: 2px; overflow: hidden; }
.cell::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(170deg, transparent 0 9px, rgba(255,255,255,.35) 9px 10px, transparent 10px 20px); opacity: .6; }
[data-board="cpu"] .cell:not(.miss):not(.hit):hover { background: #FFE8A8; }
[data-board="cpu"] .cell:not(.miss):not(.hit):hover::after { content: '⌖'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 26px; color: var(--red); }
.cell i { position: absolute; inset: 0; }
.cell.ship { background: linear-gradient(160deg, #7E92A6, #5E7287); }
.cell.ship.st-l { border-radius: 40% 2px 2px 40%; } .cell.ship.st-r { border-radius: 2px 40% 40% 2px; }
.cell.ship.st-t { border-radius: 40% 40% 2px 2px; } .cell.ship.st-b { border-radius: 2px 2px 40% 40%; }
.cell.ship::before { background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.35) 0 18%, transparent 19%); opacity: 1; }
.cell.miss i::after { content: ''; position: absolute; left: 50%; top: 50%; width: 30%; height: 30%; transform: translate(-50%, -50%); border-radius: 50%; background: var(--white); box-shadow: 0 0 0 4px rgba(255,255,255,.35), 0 0 0 9px rgba(255,255,255,.15); }
.cell.hit { background: linear-gradient(160deg, #F2B3A6, #E07B6B); }
.cell.hit i::before, .cell.hit i::after { content: ''; position: absolute; left: 50%; top: 50%; width: 62%; height: 12%; background: var(--red); border-radius: 3px; }
.cell.hit i::before { transform: translate(-50%, -50%) rotate(45deg); } .cell.hit i::after { transform: translate(-50%, -50%) rotate(-45deg); }
.cell.ship.hit { background: linear-gradient(160deg, #A54A3E, #7C2E25); }
.cell.sunk { background: linear-gradient(160deg, #3A2B2B, #1E1515) !important; }
.cell.sunk i::before, .cell.sunk i::after { background: #FF8A6B; }
.cell.prev { background: #A9D8B4; } .cell.prev.bad { background: #F2B3A6; }
.cell.nope { animation: nope .3s; }
@keyframes nope { 25%, 75% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
.cell.boom::after { content: ''; position: absolute; left: 50%; top: 50%; width: 10%; height: 10%; border-radius: 50%; border: 3px solid var(--brass); transform: translate(-50%, -50%); animation: ring .7s ease-out forwards; }
@keyframes ring { to { width: 180%; height: 180%; opacity: 0; } }
.battlescr.busy [data-board="cpu"] .cell { cursor: wait; }

.setup-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr); gap: 20px; align-items: start; }
.setupscr h2 { font-size: 34px; }
.dock { display: grid; gap: 12px; }
.ships { display: grid; gap: 8px; }
.shipbtn { display: grid; grid-template-columns: 112px 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border: 2px solid var(--line); border-radius: 4px; background: #fff; font-weight: 700; }
.shipbtn .hull { grid-row: span 2; display: flex; gap: 2px; }
.shipbtn .hull i { width: 24px; height: 18px; background: #6F849A; border-radius: 3px; }
.shipbtn .hull i:first-child { border-radius: 9px 3px 3px 9px; } .shipbtn .hull i:last-child { border-radius: 3px 9px 9px 3px; }
.shipbtn small { font-family: var(--fm); font-weight: 500; color: var(--ink2); }
.shipbtn.on { border-color: var(--ink); background: #FFF3D1; }
.shipbtn.done .hull i { background: var(--ok); }

.hud { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: var(--ink); border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
.hud div { background: var(--white); padding: 8px 12px; display: grid; }
.hud small { font-family: var(--fm); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.hud b { font-family: var(--fd); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; }
.statusbar { margin-bottom: 12px; }
.st { display: inline-block; padding: 6px 12px; border-radius: 4px; font-weight: 700; }
.st.you { background: var(--ink); color: var(--white); }
.st.fire { background: var(--red); color: #fff; animation: pulse 1s ease-in-out infinite alternate; }
.st.cpu { background: var(--paper2); color: var(--ink2); border: 2px dashed var(--ink2); }
@keyframes pulse { to { box-shadow: 0 0 0 6px rgba(200,55,45,.2); } }
.sea.enemy .grid { max-width: 560px; }
.battle-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(260px, .85fr); gap: 20px; align-items: start; }
.side { display: grid; gap: 14px; }
.sea.small .grid { grid-template-columns: 28px repeat(6, minmax(0, 1fr)); }
.sea.small .rh b { font-size: 15px; }
.log { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 14px; }
.log li { padding: 4px 8px; border-left: 4px solid var(--line); background: var(--paper); }
.log li.good { border-color: var(--ok); } .log li.bad { border-color: var(--red); } .log li.cpu { border-color: var(--ink2); }
.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--deep); color: var(--white); padding: 10px 18px; border-radius: 6px; font-weight: 700; opacity: 0; pointer-events: none; z-index: 40; }
.toast.on { animation: toast 1.8s ease forwards; }
@keyframes toast { 10%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 10px); } }

/* pergunta */
.veil { position: fixed; inset: 0; background: rgba(15,42,71,.55); display: grid; place-items: center; padding: 16px; z-index: 30; }
.modal { width: min(560px, 100%); max-height: 92vh; overflow: auto; background: var(--white); border: 2px solid var(--ink); border-radius: 8px; padding: 18px; box-shadow: 10px 10px 0 rgba(15,42,71,.35); animation: rise .2s ease-out; }
.modal.q { width: min(760px, 100%); }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
.modal h3 { font-size: 26px; }
.modal form { display: grid; gap: 12px; }
.modal label { display: grid; gap: 4px; font-weight: 700; }
.qgrid { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: center; margin: 6px 0 12px; }
.qfig .fig { width: 100%; height: auto; display: block; }
.fig .fl { font-family: var(--fm); font-size: 13px; font-weight: 600; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
.qtxt { margin: 0 0 8px; font-size: 17px; }
.qask { margin: 0; font-weight: 800; font-size: 19px; }
.fb:empty { display: none; }
.fb { margin: 12px 0; padding: 10px 14px; border: 2px solid; border-radius: 4px; }
.fb.warn { border-color: var(--line); }
.fb.ok { border-color: var(--ok); background: #E7F3EA; } .fb.no { border-color: var(--red); background: #FBE9E6; }
.fb-h { margin: 0; font-weight: 800; }
.steps { margin: 6px 0 0; padding-left: 22px; }

/* teclado */
.kp { display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px; align-items: start; }
.kp-screen { background: var(--deep); color: #fff; padding: 8px 14px; border-radius: 4px; }
.kp-l { font-family: var(--fm); font-size: 11px; letter-spacing: .12em; color: #9DB3C8; text-transform: uppercase; }
.kp-v { display: flex; align-items: baseline; gap: 4px; font-family: var(--fm); min-height: 44px; flex-wrap: wrap; }
.kp-num { font-size: 30px; color: #FFD27A; font-weight: 600; }
.kp-num.empty { width: 18px; border-bottom: 3px solid #FFD27A; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.kp-pi { font-size: 26px; color: #FFD27A; font-style: normal; }
.kp-u { color: #C9D6E3; font-size: 17px; margin-left: 6px; }
.kp-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.kp-keys button { padding: 7px 0; font-family: var(--fm); font-size: 20px; font-weight: 600; border: 2px solid var(--ink); border-radius: 4px; background: #fff; box-shadow: 0 2px 0 var(--ink); }
.kp-keys button:active { transform: translateY(2px); box-shadow: none; }
.locked .kp-keys button { pointer-events: none; opacity: .45; }

/* fim */
.result { margin: 10px 0 18px; }
.result h1 { font-size: clamp(32px, 5.5vw, 60px); }
.result.win h1 { color: var(--ok); } .result.lose h1 { color: var(--red); }
.bigscore { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.bigscore b { font-family: var(--fd); font-weight: 400; font-size: 64px; line-height: 1; }
.bigscore span { font-family: var(--fm); color: var(--ink2); }
.end-grid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 20px; align-items: start; margin-bottom: 20px; }
.xray { width: 100%; border-collapse: collapse; font-size: 14px; }
.xray th, .xray td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.xray th { font-family: var(--fm); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.xray td:nth-child(3), .xray td:nth-child(4) { font-family: var(--fm); text-align: center; }
.xray tr.warn td { background: #FBE9E6; } .xray tr.good td { background: #E7F3EA; }

.page h2 { font-size: 34px; }
.hall { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 4px; }
.hall li { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 12px; align-items: center; padding: 8px 12px; background: var(--white); border: 2px solid var(--line); border-radius: 4px; }
.hall .pos { font-family: var(--fd); color: var(--red); font-size: 20px; } .hall small { font-family: var(--fm); color: var(--ink2); } .hall .pz { font-family: var(--fm); font-weight: 600; } .hall .dt { font-family: var(--fm); font-size: 12px; color: var(--ink2); }
.tcards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
.gab { margin: 16px 0; } .gab summary { font-weight: 800; cursor: pointer; } .gab li { margin: 6px 0; }

body.proj #app { max-width: 1560px; }
body.proj .qtxt { font-size: 22px; } body.proj .qask { font-size: 25px; } body.proj .modal.q { width: min(1100px, 100%); }

@media (max-width: 900px) {
  .battle-grid, .setup-grid, .end-grid, .home-grid { grid-template-columns: minmax(0, 1fr); }
  .hero { grid-template-columns: 1fr; } .rose { display: none; }
  .hud { grid-template-columns: repeat(3, 1fr); }
  .hud div:nth-child(4), .hud div:nth-child(5) { grid-column: span 1; }
}
@media (max-width: 560px) {
  .grid { grid-template-columns: 30px repeat(6, minmax(0, 1fr)); }
  .grid .rh small { display: none; }
  .grid .rh b { font-size: 16px; }
  .hud { grid-template-columns: repeat(2, 1fr); } .hud div:last-child { grid-column: span 2; }
  .qgrid { grid-template-columns: 1fr; } .qfig { max-width: 220px; margin: 0 auto; }
  .kp { grid-template-columns: 1fr; }
  .seg3 span { font-size: 13px; }
  .hall li { grid-template-columns: 34px 1fr auto; } .hall .dt { display: none; }
  .tcards { grid-template-columns: 1fr; }
  .top-r { margin-left: 0; width: 100%; justify-content: space-between; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

[hidden]{display:none!important}
</style>
</head>
<body>

/* ---------- teclado numérico ---------- */
function keypad(host, o) {
  const opt = Object.assign({ unit: '', pi: false, int: false, label: 'Sua resposta' }, o || {});
  let val = ''; let locked = false;
  host.innerHTML = `<div class="kp">
    <div class="kp-screen"><span class="kp-l">${opt.label}</span><div class="kp-v"><b class="kp-num">&nbsp;</b>${opt.pi ? '<i class="kp-pi">π</i>' : ''}<span class="kp-u">${opt.unit}</span></div></div>
    <div class="kp-keys">${['7', '8', '9', '4', '5', '6', '1', '2', '3', opt.int ? '' : ',', '0', '⌫'].map((k) => (k ? `<button type="button" data-k="${k}" ${k === '⌫' ? 'aria-label="Apagar"' : ''}>${k}</button>` : '<span></span>')).join('')}</div>
  </div>`;
  const num = host.querySelector('.kp-num');
  const show = () => { num.textContent = val || ' '; num.classList.toggle('empty', !val); };
  const press = (k) => {
    if (locked) return;
    if (k === '⌫') val = val.slice(0, -1);
    else if (k === ',') { if (!val.includes(',')) val = (val || '0') + ','; } else if (val.replace(',', '').length < 9) val = val === '0' ? k : val + k;
    show(); if (opt.onChange) opt.onChange(val);
  };
  host.querySelector('.kp-keys').addEventListener('click', (e) => { const b = e.target.closest('button[data-k]'); if (b) press(b.dataset.k); });
  const kb = (e) => {
    if (locked || e.target.tagName === 'INPUT' || document.querySelector('.veil')) return;
    if (/^[0-9]$/.test(e.key)) press(e.key); else if ((e.key === ',' || e.key === '.') && !opt.int) press(','); else if (e.key === 'Backspace') press('⌫'); else return;
    e.preventDefault();
  };
  document.addEventListener('keydown', kb);
  KEYHANDLERS.push(() => document.removeEventListener('keydown', kb));
  show();
  return { get: () => parseBR(val), raw: () => val, set: (v) => { val = String(v).replace('.', ','); show(); }, lock: () => { locked = true; host.classList.add('locked'); }, unlock: () => { locked = false; host.classList.remove('locked'); }, clear: () => { val = ''; show(); } };
}
const KEYHANDLERS = [];
function clearKeyHandlers() { while (KEYHANDLERS.length) KEYHANDLERS.pop()(); }

/* ---------- figuras (traço de carta náutica) ---------- */
const INK = '#14365C'; const FILL = '#DCEBF1'; const FILL2 = '#C5DDE8'; const RED = '#C8372D';
const svgw = (w, h, body) => `<svg class="fig" viewBox="0 0 ${w} ${h}" role="img" aria-hidden="true">${body}</svg>`;
const lab = (x, y, t, c, anchor) => `<text x="${x}" y="${y}" text-anchor="${anchor || 'middle'}" class="fl" style="fill:${c || INK}">${t}</text>`;
function figCyl(o) {
  const cx = 110; const rx = o.rx || 52; const ry = 14; const top = 34; const H = o.H || 110; const b = top + H;
  let s = `<path d="M${cx - rx},${top} V${b} A${rx},${ry} 0 0 0 ${cx + rx},${b} V${top}" fill="${FILL}" stroke="${INK}" stroke-width="2"/>`;
  s += `<path d="M${cx - rx},${b} A${rx},${ry} 0 0 1 ${cx + rx},${b}" fill="none" stroke="${INK}" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  s += `<ellipse cx="${cx}" cy="${top}" rx="${rx}" ry="${ry}" fill="${FILL2}" stroke="${INK}" stroke-width="2"/>`;
  if (o.cone) s += `<path d="M${cx - rx},${b} L${cx},${top} L${cx + rx},${b}" fill="#F3D9C9" fill-opacity=".85" stroke="${RED}" stroke-width="2"/>`;
  if (o.r) s += `<line x1="${cx}" y1="${top}" x2="${cx + rx}" y2="${top}" stroke="${RED}" stroke-width="2.4"/><circle cx="${cx}" cy="${top}" r="2.6" fill="${RED}"/>` + lab(cx + rx / 2, top - 8, o.r, RED);
  if (o.d) s += `<line x1="${cx - rx}" y1="${top}" x2="${cx + rx}" y2="${top}" stroke="${RED}" stroke-width="2.4"/>` + lab(cx, top - 8, o.d, RED);
  if (o.h) s += `<line x1="${cx + rx + 12}" y1="${top}" x2="${cx + rx + 12}" y2="${b}" stroke="${INK}" stroke-width="1.4"/>` + lab(cx + rx + 18, top + H / 2 + 4, o.h, INK, 'start');
  if (o.sec) s += `<rect x="${cx - rx}" y="${top}" width="${2 * rx}" height="${H}" fill="${RED}" fill-opacity=".14" stroke="${RED}" stroke-dasharray="5 4" stroke-width="1.6"/>`;
  return svgw(240, b + 26, s);
}
function figCone(o) {
  const cx = 110; const rx = 60; const ry = 15; const top = 22; const b = 150;
  let s = `<path d="M${cx - rx},${b} L${cx},${top} L${cx + rx},${b} A${rx},${ry} 0 0 1 ${cx - rx},${b}" fill="${FILL}" stroke="${INK}" stroke-width="2"/>`;
  s += `<path d="M${cx - rx},${b} A${rx},${ry} 0 0 1 ${cx + rx},${b}" fill="none" stroke="${INK}" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  if (o.h) s += `<line x1="${cx}" y1="${top}" x2="${cx}" y2="${b}" stroke="${INK}" stroke-width="1.6" stroke-dasharray="5 4"/>` + lab(cx - 8, (top + b) / 2, o.h, INK, 'end');
  if (o.r) s += `<line x1="${cx}" y1="${b}" x2="${cx + rx}" y2="${b}" stroke="${RED}" stroke-width="2.4"/>` + lab(cx + rx / 2, b + 22, o.r, RED);
  if (o.g) s += `<line x1="${cx}" y1="${top}" x2="${cx + rx}" y2="${b}" stroke="#2F6DB5" stroke-width="3"/>` + lab(cx + rx / 2 + 16, (top + b) / 2, o.g, '#2F6DB5', 'start');

function figSector(o) {
  const cx = 120; const cy = 30; const R = 120; const th = (o.ang * Math.PI) / 180; const a0 = Math.PI / 2 - th / 2; const a1 = Math.PI / 2 + th / 2;

      case 'veil': if (e.target === el && modal && modal.type !== 'q') { modal = null; renderModal(); } break;
      case 'close': modal = null; renderModal(); break;
      case 'teacher': modal = { type: 'pin' }; renderModal(); break;
      case 'hall': go('hall'); break;
      case 'home': go('home'); break;
      case 'goback': go(back()); break;
      case 'selship': setup.sel = el.dataset.id; render(); break;
      case 'rotate': setup.vert = !setup.vert; render(); break;
      case 'randfleet': G.mine = randomFleet(); save(); render(); break;
      case 'place': {
        const r = +el.dataset.r; const c = +el.dataset.c; const there = shipAt(G.mine, r, c);
        if (there && there.id !== setup.sel) { setup.sel = there.id; render(); return; }
        const f = FLEET.find((x) => x.id === setup.sel); if (!f) return;
        const cells = cellsOf(r, c, f.s, setup.vert);
        if (!fits(G.mine, cells, f.id)) { el.classList.add('nope'); setTimeout(() => el.classList.remove('nope'), 300); return; }
        G.mine = G.mine.filter((s) => s.id !== f.id).concat([{ id: f.id, cells }]);
        const next = FLEET.find((x) => !G.mine.some((s) => s.id === x.id)); if (next) setup.sel = next.id;
        save(); render(); break;
      }
      case 'startbattle': G.phase = 'battle'; logIt('Frotas posicionadas. Boa caçada, comandante!', 'me'); save(); go('battle'); break;
      case 'aim': {
        if (busy) return; const r = +el.dataset.r; const c = +el.dataset.c; if (G.myShots[r][c]) return;
        if (G.pending > 0) fire(r, c); else ask(r, c);
        break;
      }
      case 'qcheck': check(); break;
      case 'qcancel': modal = null; renderModal(); break;
      case 'qfire': { const { r, c } = modal; modal = null; fire(r, c); break; }
      case 'qpass': modal = null; G.pending = 0; save(); cpuTurn(); break;
      case 'quit': modal = { type: 'quit' }; renderModal(); break;
      case 'quitYes': go('home'); break;
      case 'again': newGame(G.name, G.turma, G.diff); setup = { sel: 'pa', vert: false, hover: null }; go('setup'); break;
      case 'copy': {
        const ok = G.stats.reduce((s, x) => s + x.ok, 0); const er = G.stats.reduce((s, x) => s + x.err, 0);
        const t = `Batalha Naval · Corpos Redondos\n${G.name} (${G.turma}) · nível ${DIFF[G.diff].nome}\n${G.result === 'win' ? 'Vitória' : 'Derrota'} · ${G.score} pontos · ${ok} certas, ${er} erradas\n${new Date().toLocaleString('pt-BR')}`;
        const done = () => { el.textContent = 'Copiado!'; };
        if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => window.prompt('Copie o resultado:', t)); else window.prompt('Copie o resultado:', t);
        break;
      }
      case 'proj': projection = !projection; render(); break;
      case 'classgame': newGame('Turma', el.dataset.t, 'capitao'); projection = true; go('setup'); break;
      case 'wipe': if (window.confirm('Apagar a batalha atual e todos os destaques deste computador?')) { DB = { cur: null, hall: [], last: DB.last }; G = null; save(); go('home'); } break;
      default: break;
    }
  }
  $app.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el && el.dataset.act && !el.disabled) act(el.dataset.act, el, e); });
  $app.addEventListener('pointerover', (e) => {
    if (screen !== 'setup') return; const el = e.target.closest('[data-act="place"]'); if (!el) return;
    const h = [+el.dataset.r, +el.dataset.c]; if (setup.hover && setup.hover[0] === h[0] && setup.hover[1] === h[1]) return; setup.hover = h; render();
  });
  $app.addEventListener('submit', (e) => {
    e.preventDefault(); const f = e.target;
    if (f.dataset.form === 'start') {
      const name = f.nome.value.trim().replace(/\s+/g, ' '); const tr = f.querySelector('input[name="turma"]:checked'); const df = f.querySelector('input[name="diff"]:checked');
      if (!name || !tr) return; DB.last = { name, turma: tr.value, diff: df ? df.value : 'capitao' };
      newGame(name, tr.value, df ? df.value : 'capitao'); setup = { sel: 'pa', vert: false, hover: null }; go('setup');
    }
    if (f.dataset.form === 'pin') { if (fnv('missao:' + norm(f.pin.value)) === PIN_HASH) go('teacher'); else { modal = { type: 'pin', err: true }; renderModal(); } }
  });
  document.addEventListener('keydown', (e) => {
    if (screen === 'setup' && (e.key === 'r' || e.key === 'R') && e.target.tagName !== 'INPUT') { setup.vert = !setup.vert; render(); }
    if (e.key === 'Enter' && modal && modal.type === 'q') { const b = $app.querySelector('#qact .btn.red'); if (b) { e.preventDefault(); b.click(); } }
    if (e.key === 'Escape' && modal && modal.type !== 'q') { modal = null; renderModal(); }
  });
  // continua a vez do computador se a página recarregou no meio dela
  if (G && G.phase === 'battle' && G.pending < 0) G.pending = 0;
  render();
}());

</script>
</body>
