<style>
/* Trilha UNIFEI 2027 — carta topográfica da Serra da Mantiqueira: papel, curvas de nível, verde-mata e marcos em terracota */
:root {
  --paper: #0E1714; --paper2: #1A2823; --card: #14211C; --ink: #EEF1E7; --ink2: #C3CDC0; --mute: #91A096; --line: #2C3D36; --contour: #2E433A;
  --green: #3B8A64; --green2: #57A97F; --green-l: #1C3A2D; --terra: #F2A13B; --terra-d: #D9861F; --ochre: #F6C85F; --bad: #FF6B5A; --bad-l: #3A1E1B; --good-l: #16322A; --glow: rgba(246, 200, 95, .16);
  --fd: "Fraunces", Georgia, serif; --fb: "Atkinson Hyperlegible", system-ui, sans-serif; --fm: "JetBrains Mono", ui-monospace, monospace;
  --r: 14px; --sh: 0 1px 0 rgba(30, 42, 35, .06), 0 10px 30px -18px rgba(30, 42, 35, .35);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.55 var(--fb); min-height: 100vh; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
h1, h2, h3 { font-family: var(--fd); font-weight: 700; letter-spacing: -.01em; line-height: 1.15; margin: 0 0 .5em; }
h2 { font-size: clamp(24px, 3vw, 32px); }
h3 { font-size: 19px; margin-top: 1.4em; }
.muted { color: var(--mute); } .small { font-size: 14px; }
.kick { font: 700 12.5px/1.4 var(--fm); letter-spacing: .08em; text-transform: uppercase; color: var(--terra); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
.narrow { max-width: 720px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); padding: clamp(18px, 3vw, 30px); }
.center { text-align: center; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
.row.center { justify-content: center; }
.ic { width: 20px; height: 20px; flex: none; }
.btn { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 700; background: var(--paper2); color: var(--ink); transition: transform .12s, background .15s, box-shadow .15s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn.hot { background: var(--terra); color: #fff; box-shadow: 0 6px 16px -8px var(--terra-d); }
.btn.hot:hover:not(:disabled) { background: var(--terra-d); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.big { padding: 15px 26px; font-size: 18px; }
.btn:disabled { opacity: .45; }
.link { background: none; border: 0; padding: 0; color: var(--green); text-decoration: underline; text-underline-offset: 3px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }
.fld { display: grid; gap: 6px; border: 0; padding: 0; margin: 0 0 14px; }
.fld span, .fld legend { font: 700 12px var(--fm); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); padding: 0; margin-bottom: 6px; }
.fld input[type=text], .fld input:not([type]), .fld input[type=password] { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper2); width: 100%; }
.fld input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-l); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: inline-block; padding: 9px 18px; border-radius: 999px; border: 1.5px solid var(--line); font: 700 15px var(--fm); background: var(--paper2); cursor: pointer; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 0; }
.chip input:checked + span { background: var(--green); border-color: var(--green); color: #fff; }
.chip input:focus-visible + span { outline: 3px solid var(--ochre); }
.err { color: var(--bad); font-weight: 700; }

/* ---------- curvas de nível ---------- */
.topo { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.topo path { fill: none; stroke: var(--contour); stroke-width: 1.1; opacity: .5; }

/* ---------- capa ---------- */
.cover { position: relative; min-height: 100vh; overflow: hidden; display: grid; place-items: center; padding: 40px 20px 220px; }
.cover-in { position: relative; z-index: 2; max-width: 620px; width: 100%; text-align: center; }
.cover .kick { justify-content: center; }
.logo { height: 22px; width: auto; }
.cover h1 { font-size: clamp(48px, 9vw, 96px); line-height: .95; margin: 6px 0 18px; font-weight: 800; }
.cover h1 em { font-style: italic; color: var(--green); font-weight: 700; }
.sub { font-size: 18px; color: var(--ink2); margin: 0 auto 14px; max-width: 560px; }
.count { display: inline-block; font: 700 14px var(--fm); background: var(--paper2); border: 1px solid var(--line); color: var(--ink); padding: 8px 16px; border-radius: 999px; margin: 0 0 22px; }
.count b { color: var(--ochre); font-size: 17px; }
.start { text-align: left; max-width: 460px; margin: 0 auto; }
.start .btn { width: 100%; justify-content: center; margin-top: 4px; }
.cover-links { display: flex; justify-content: center; gap: 22px; margin-top: 18px; flex-wrap: wrap; }
.cover-prof { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; opacity: .9; }
.cover-prof .perfil { display: block; width: 100%; height: 280px; min-width: 0; }

/* ---------- topo das páginas ---------- */
.hud { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: rgba(14, 23, 20, .9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; color: var(--green); }
.brand .ic { width: 28px; height: 28px; }
.brand span { font: 800 17px/1.1 var(--fd); color: var(--ink); display: grid; }
.brand small { font: 700 11px var(--fm); letter-spacing: .1em; text-transform: uppercase; color: var(--terra); }
.hud-r { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.stat { display: grid; text-align: right; }
.stat small { font: 700 10.5px var(--fm); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.stat b { font: 700 16px var(--fm); }
.ibtn { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); display: grid; place-items: center; }
.proj-tag { font: 700 12px var(--fm); background: var(--ochre); color: var(--ink); padding: 4px 10px; border-radius: 999px; text-transform: uppercase; }
.page { min-height: 100vh; padding-bottom: 60px; }

/* ---------- mapa ---------- */
.map-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; padding-top: 28px; flex-wrap: wrap; }
.map-head > div { max-width: 640px; }
.map-head p.muted { margin: 0; }
.map-svg { margin: 10px auto 18px; overflow-x: auto; max-width: 1240px; padding: 0 10px; }
.perfil { display: block; width: 100%; min-width: 680px; height: auto; }
.perfil .r2 { fill: #18261F; }
.perfil .r1 { fill: #22382D; }
.perfil .trail { fill: none; stroke: var(--ink2); stroke-width: 2.5; stroke-dasharray: 3 8; stroke-linecap: round; }
.perfil .trail.done { stroke: var(--terra); stroke-dasharray: none; stroke-width: 4; }
.perfil .summit path { fill: none; stroke: var(--terra); stroke-width: 3; stroke-linejoin: round; }
.perfil .summit text { font: 800 15px var(--fm); fill: var(--ink); }
.mk circle { fill: var(--card); stroke: var(--ink2); stroke-width: 2.5; }
.mk text { font: 800 15px var(--fm); fill: var(--ink); }
.mk .alt { font: 700 11px var(--fm); fill: var(--mute); }
.mk.ok circle { fill: var(--green); stroke: var(--green); } .mk.ok text:not(.alt) { fill: #fff; }
.mk.now circle { fill: var(--terra); stroke: var(--terra-d); animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } .mk.now text:not(.alt) { fill: #fff; }
.mk.lock circle { fill: var(--paper2); stroke: #4A5D54; } .mk.lock text { fill: #7E8D84; }
.mk[role=button] { cursor: pointer; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.marcos { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.marcos button { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; }
.marcos button:hover:not(:disabled) { border-color: var(--green2); }
.mn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 800 15px var(--fm); background: var(--paper2); flex: none; }
.ok .mn { background: var(--green); color: #fff; }
.now .mn { background: var(--terra); color: #fff; }
.mt { display: grid; flex: 1; } .mt b { font-weight: 700; } .mt small { color: var(--mute); font-size: 13.5px; line-height: 1.3; }
.mp { font: 700 16px var(--fm); white-space: nowrap; } .mp small { color: var(--mute); font-size: 12px; }
.lock button { opacity: .6; }

/* ---------- questão ---------- */
.qwrap { max-width: 820px; padding-top: 18px; }
.crumbs { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font: 700 13px var(--fm); color: var(--ink2); margin-bottom: 14px; }
.crumbs .dots { margin-left: auto; display: flex; gap: 6px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: block; }
.dots i.on { outline: 2px solid var(--terra); outline-offset: 2px; }
.dots i.g { background: var(--green); } .dots i.b { background: var(--bad); }
.qn { font: 700 12.5px var(--fm); letter-spacing: .06em; text-transform: uppercase; color: var(--terra); margin: 0 0 12px; }
.enun { font-size: 19px; line-height: 1.6; }
.m { white-space: nowrap; font-family: var(--fb); }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; margin: 0 2px; line-height: 1.15; }
.fr i { font-style: normal; padding: 0 3px; }
.fr i:first-child { border-bottom: 1.5px solid currentColor; }
.rq { border-top: 1.5px solid currentColor; padding: 0 2px; margin-left: 1px; }
.mat { display: inline-grid; grid-template-columns: auto auto; gap: 2px 14px; vertical-align: middle; padding: 2px 10px; border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); border-radius: 6px; font-family: var(--fb); margin: 0 4px; }
.viz { margin: 16px 0 4px; display: flex; justify-content: center; }
.viz svg { width: 100%; max-width: 380px; height: auto; }
.viz .fill { fill: var(--green-l); } .viz .stk { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; } .viz .thin { fill: none; stroke: var(--ink2); stroke-width: 1.3; }
.viz .dash { fill: none; stroke: var(--ink2); stroke-width: 1.4; stroke-dasharray: 5 4; } .viz .dot { fill: var(--terra); }
.viz .lb { font: 700 13px var(--fb); fill: var(--ink); } .viz .lb.it { font-style: italic; fill: var(--green); }
.viz .gl { stroke: var(--line); } .viz .ax { font: 12px var(--fm); fill: var(--mute); } .viz .bar { fill: var(--green2); } .viz .bv { font: 700 12px var(--fm); fill: var(--ink); }
.alts { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 10px; }
.alt { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper2); font-size: 17.5px; transition: border-color .12s, background .12s; }
.alt:hover:not(:disabled) { border-color: var(--ink2); background: var(--paper); }
.alt .lt { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 800 15px var(--fm); border: 1.5px solid var(--ink2); flex: none; }
.alt .tx { flex: 1; }
.alt .tag { color: inherit; }
.alt.sel { border-color: var(--terra); background: rgba(242, 161, 59, .12); box-shadow: 0 0 0 3px rgba(194, 80, 47, .15); }
.alt.sel .lt { background: var(--terra); border-color: var(--terra); color: #fff; }
.alt.right { border-color: var(--green); background: var(--good-l); }
.alt.right .lt { background: var(--green); border-color: var(--green); color: #fff; }
.alt.wrong { border-color: #6B2E27; background: var(--bad-l); color: #FFB3A8; text-decoration: line-through; text-decoration-color: rgba(125, 42, 32, .5); }
.alt.wrong .lt { border-color: var(--bad); color: var(--bad); }
.alt:disabled:not(.right):not(.wrong) { opacity: .6; }
.warn-line { margin: 16px 0 0; padding: 10px 14px; border-radius: 10px; background: rgba(246, 200, 95, .12); border: 1px solid rgba(246, 200, 95, .45); font-weight: 700; }
.sol { margin-top: 18px; padding: 16px 18px; border-radius: 12px; border-left: 5px solid var(--green); background: var(--good-l); }
.sol.bad { border-left-color: var(--bad); background: var(--bad-l); }
.sol p { margin: 0; } .sol-h { font: 800 17px var(--fd); margin-bottom: 6px !important; }

/* ---------- marco concluído e cume ---------- */
.marco-ok { margin-top: 30px; }
.badge { width: 70px; height: 70px; margin: 0 auto 12px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; }
.badge .ic { width: 34px; height: 34px; }
.marco-ok .kick { justify-content: center; }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
.nums div { background: var(--paper); border-radius: 12px; padding: 12px; display: grid; text-align: center; }
.nums b { font: 800 clamp(22px, 4vw, 30px) var(--fm); color: var(--green); }
.nums small { color: var(--mute); font-size: 13px; }
.summit-card { margin-top: 26px; overflow: hidden; padding-top: 0; }
.sum-top { position: relative; margin: 0 calc(-1 * clamp(18px, 3vw, 30px)) 10px; padding: 34px clamp(18px, 3vw, 30px) 24px; background: var(--green); color: #fff; overflow: hidden; }
.sum-top .topo path { stroke: rgba(255, 255, 255, .25); opacity: 1; }
.sum-top > *:not(.topo) { position: relative; }
.sum-top .kick { color: var(--ochre); }
.rank { display: inline-block; font: 800 16px var(--fm); background: var(--ochre); color: var(--ink); padding: 6px 14px; border-radius: 999px; margin: 0; }
.perf { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.perf li { display: grid; grid-template-columns: minmax(150px, 1fr) 1.2fr 40px; align-items: center; gap: 12px; font-size: 15px; }
.perf .bar { height: 10px; background: var(--paper2); border-radius: 999px; overflow: hidden; }
.perf .bar i { display: block; height: 100%; background: var(--ochre); border-radius: 999px; }
.perf li.top .bar i { background: var(--green); } .perf li.low .bar i { background: var(--terra); }
.perf b { font-family: var(--fm); text-align: right; }
.tip { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: rgba(242, 161, 59, .12); border: 1px solid rgba(242, 161, 59, .45); }
.tip.good { background: var(--good-l); border-color: #2F5E48; }
.cert { font: 700 13px var(--fm); color: var(--mute); margin-top: 16px; }

/* ---------- pódio, recordes, professor ---------- */
.podium, .hall { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 6px; text-align: left; }
.podium li, .hall li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--paper); flex-wrap: wrap; }
.podium li.me { outline: 2px solid var(--terra); }
.p-n, .h-n { font: 800 15px var(--fm); width: 30px; }
.p-t, .p-r { color: var(--mute); font-size: 14px; }
.p-p { margin-left: auto; font-family: var(--fm); }
.hall li b:last-child { margin-left: auto; font-family: var(--fm); }
.p-mine { font-weight: 700; }
.pulse { animation: blink 1.4s ease-in-out infinite; } @keyframes blink { 50% { opacity: .45; } }
.tcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.tcards > div { background: var(--paper); border-radius: 12px; padding: 16px; }
.tcards h3 { margin-top: 0; }
.local { margin-top: 20px; }
.prof-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.seg-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.seg-tabs button { border: 1.5px solid var(--line); background: var(--paper2); border-radius: 999px; padding: 6px 12px; font: 700 13px var(--fm); }
.seg-tabs button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg-tabs.big button { font-size: 14px; padding: 8px 14px; }
.tscroll { overflow-x: auto; }
.live { width: 100%; border-collapse: collapse; font-size: 14px; }
.live th, .live td { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.live td small { display: block; color: var(--mute); }
.live td.num { text-align: right; font-family: var(--fm); font-weight: 700; }
.live .warn, .warn { color: var(--bad); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dot.on { background: #2BB673; } .dot.fim { background: var(--green); }
.feed { list-style: none; padding: 0; font-size: 14px; display: grid; gap: 4px; }
.ok { color: var(--green); }

/* ---------- modal, toast, guarda ---------- */
.veil { position: fixed; inset: 0; z-index: 50; background: rgba(30, 42, 35, .45); display: grid; place-items: center; padding: 20px; }
.modal { width: min(420px, 100%); }
.menu { display: grid; gap: 8px; } .menu .btn { justify-content: center; }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-weight: 700; opacity: 0; visibility: hidden; transition: .2s; z-index: 60; }
#toast.on { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
#guard { position: fixed; inset: 0; z-index: 80; background: rgba(5, 9, 8, .86); display: grid; place-items: center; padding: 20px; }
.guard-box { background: var(--card); border-radius: var(--r); padding: 28px; max-width: 440px; text-align: center; }
.guard-ic { font-size: 40px; color: var(--terra); } .guard-box small { font: 700 12px var(--fm); letter-spacing: .1em; color: var(--terra); }
.guard-box dl { display: flex; justify-content: center; gap: 24px; } .guard-box dt { font-size: 13px; color: var(--mute); } .guard-box dd { margin: 0; font: 800 22px var(--fm); }
.guard-box .btn { justify-content: center; width: 100%; }

@media (max-width: 640px) {
  body { font-size: 16px; }
  .hud { padding: 8px 12px; } .brand span { font-size: 15px; } .stat b { font-size: 14px; } .hud-r { gap: 10px; }
  .enun { font-size: 17px; } .alt { font-size: 16px; padding: 10px 12px; gap: 10px; } .alt .lt { width: 30px; height: 30px; }
  .map-head .btn { width: 100%; justify-content: center; }
  .perf li { grid-template-columns: 1fr 70px 34px; font-size: 14px; }
  .cover { padding-bottom: 150px; }
  .wrap { padding: 0 14px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

[hidden]{display:none!important}

/* ===== Rodada 2 · subida noturna ===== */
body { background: radial-gradient(1100px 600px at 80% -10%, rgba(87, 169, 127, .10), transparent 60%), var(--paper); }
.btn.hot { color: #1D1203; }
.btn.hot:hover:not(:disabled) { color: #1D1203; }
.cover::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .7;
  background-image: radial-gradient(1.4px 1.4px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 32% 8%, #fff, transparent), radial-gradient(1.2px 1.2px at 58% 22%, #fff, transparent),
    radial-gradient(1px 1px at 74% 12%, #fff, transparent), radial-gradient(1.6px 1.6px at 88% 30%, #fff, transparent), radial-gradient(1px 1px at 22% 40%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 46% 34%, #fff, transparent), radial-gradient(1px 1px at 66% 44%, #fff, transparent), radial-gradient(1px 1px at 8% 56%, #fff, transparent), radial-gradient(1.3px 1.3px at 94% 52%, #fff, transparent); }
.cover::after { content: ""; position: absolute; width: 90px; height: 90px; right: 9%; top: 9%; z-index: 0; border-radius: 50%; background: #F3EBD2; box-shadow: 0 0 60px 10px rgba(243, 235, 210, .18), inset -18px -6px 0 #DCD0AE; pointer-events: none; }
.cover-in { position: relative; z-index: 2; width: 100%; min-width: 0; }
.logo { background: #fff; border-radius: 6px; padding: 2px 6px; height: 24px; }
.r2tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: var(--terra); color: #1D1203; font: 800 13px var(--fm); letter-spacing: .1em; text-transform: uppercase; }
.news { list-style: none; margin: 18px auto 20px; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 10px; max-width: 720px; width: 100%; text-align: left; }
.news li { padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, .035); border: 1px solid var(--line); font-size: 15px; color: var(--ink2); }
.news b { display: block; color: var(--ink); font-family: var(--fd); font-size: 17px; margin-bottom: 2px; }
.lockbox { margin: 22px auto 0; max-width: 520px; padding: 22px; border-radius: var(--r); background: var(--card); border: 1px dashed var(--terra); text-align: center; }
.lockbox .lk { width: 54px; height: 54px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; background: rgba(242, 161, 59, .14); color: var(--terra); }
.lockbox .lk .ic { width: 26px; height: 26px; }
.lockbox h2 { margin: 0 0 6px; font-size: 24px; }
.lockbox p { margin: 0; color: var(--mute); }
.lockpage { min-height: 70vh; display: grid; place-items: center; padding: 30px 20px; }
.lantern { margin-top: 14px; padding: 12px 16px; border-radius: 12px; background: var(--glow); border: 1px solid rgba(246, 200, 95, .45); box-shadow: 0 0 40px -10px rgba(246, 200, 95, .35); }
.lantern b { color: var(--ochre); }
.btn.lamp { background: transparent; border: 1.5px dashed rgba(246, 200, 95, .6); color: var(--ochre); }
.btn.lamp:hover:not(:disabled) { background: var(--glow); }
.streak { display: inline-flex; gap: 4px; align-items: center; }
.streak i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.streak i.on { background: var(--ochre); box-shadow: 0 0 8px rgba(246, 200, 95, .7); }
.mat { display: inline-flex; flex-direction: column; gap: 2px; vertical-align: middle; margin: 2px 4px; padding: 2px 8px; border-left: 2px solid var(--ink2); border-right: 2px solid var(--ink2); border-radius: 6px; font: 700 16px var(--fm); }
.mr { display: flex; gap: 14px; justify-content: space-between; } .mr i { font-style: normal; min-width: 1.4em; text-align: center; }
.viz .bar2 { fill: var(--terra); } .viz .fill2 { fill: #3B4F70; } .viz .fill { fill: #24463A; }
.errs { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
.errs li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: var(--paper2); border: 1px solid var(--line); }
.errs li .tx { flex: 1; min-width: 0; } .errs li small { display: block; color: var(--mute); }
.errs .why { font: 700 12px var(--fm); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.why.w2 { background: rgba(242, 161, 59, .16); color: var(--terra); } .why.wx { background: var(--bad-l); color: #FFB3A8; } .why.wl { background: var(--glow); color: var(--ochre); }
.evo { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
.evo div { padding: 12px 14px; border-radius: 12px; background: var(--paper2); border: 1px solid var(--line); }
.evo b { display: block; font: 800 22px var(--fm); } .evo small { color: var(--mute); } .evo .up { color: var(--green2); } .evo .dn { color: var(--bad); }
.relbox { padding: 16px; border-radius: 12px; border: 1.5px solid var(--terra); background: rgba(242, 161, 59, .07); }
.relbox.on { border-color: var(--green2); background: var(--good-l); }
@media (max-width: 640px) { .cover::after { width: 54px; height: 54px; right: 6%; top: 3%; } }
</style>

function newGame(name, turma) {
  const seed = (Date.now() ^ fnv(name + turma)) >>> 0;
  S = { name, turma, seed, e: {}, fim: {}, t0: Date.now(), finished: false, saidas: 0, foraSeg: 0, streak: 0, bonus: 0 };
  S.sid = `${slugOf(name)}-${turma.toLowerCase()}-${seed.toString(36)}`;
  DB.cur = S; save();
  syncEv([{ ev: 'Entrou na rodada 2', det: 'Marco 1 · ' + MARCOS[0].nome, pts: 0 }]);
}
const ks = (n) => [0, 1, 2].map((j) => (n - 1) * POR + j);
const st = (k) => S.e[k] || { tries: 0, wrong: [] };
const done = (k) => { const x = S.e[k]; return !!x && (x.ok || x.tries >= 2); };

const marcoAberto = (n) => n === 1 || marcoFeito(n - 1) || projection;
const salaAtual = () => { for (let n = 1; n <= 12; n++) if (!marcoFeito(n)) return n; return 12; };

const DICA = 30; const BONUS = 50;
const ptsOf = (k) => { const x = S.e[k]; return x && x.ok ? (x.tries === 1 ? 100 : 50) - (x.dica ? DICA : 0) : x && x.tries >= 2 ? -PENAL : 0; };
const ptsSala = (n) => sum(ks(n).map(ptsOf));
const pontos = () => Math.max(0, sum(MARCOS.map((m) => ptsSala(m.n))) + ((S && S.bonus) || 0));

// curva suave fechada (Catmull-Rom → Bézier)
function smooth(pts, closed) {
  const n = pts.length; const P = (i) => pts[closed ? (i + n) % n : Math.max(0, Math.min(n - 1, i))];
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = P(i - 1); const p1 = P(i); const p2 = P(i + 1); const p3 = P(i + 2);
    d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d + (closed ? 'Z' : '');
}
// curvas de nível decorativas
function topo(seed, n) {
  const r = mulberry(seed); let d = '';
  for (let i = 0; i < (n || 5); i++) {
    const cx = 100 + r() * 1000; const cy = 60 + r() * 600; const ph = r() * 6;
    for (let j = 0; j < 5; j++) {
      const R = 34 + j * 38; const pts = [];
      for (let a = 0; a < 10; a++) { const t = (a / 10) * Math.PI * 2; const rr = R * (1 + 0.18 * Math.sin(3 * t + ph) + 0.08 * Math.cos(5 * t + ph * 2)); pts.push([cx + Math.cos(t) * rr * 1.4, cy + Math.sin(t) * rr]); }
      d += smooth(pts, true) + ' ';
    }
  }
  return `<svg class="topo" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path d="${d}"/></svg>`;
}

/* ---------- perfil da montanha (mapa) ---------- */
const PX = (i) => 60 + i * 88;
const PY = (alt) => 400 - (alt - 760) * 0.22;
function perfil(feitosN, deco) {
  const pts = MARCOS.map((m, i) => [PX(i), PY(m.alt) + (i % 2 ? 10 : -4)]);
  const top = [1090, PY(2110) - 56];
  const ground = [[-20, 430]].concat(pts.map(([x, y], i) => [x, y + 26 + (i % 3) * 6]), [[top[0], top[1] + 6], [1160, PY(2110) + 10]]);
  const ridge = smooth(ground, false) + ' L1160 470 L-20 470 Z';
  const back = [[-20, 380], [140, 330], [300, 352], [470, 250], [620, 286], [780, 170], [900, 210], [1010, 120], [1160, 150]];
  const ridge2 = smooth(back, false) + ' L1160 470 L-20 470 Z';
  const route = [[-10, 440]].concat(pts, [top]);
  const marks = deco ? '' : MARCOS.map((m, i) => {
    const [x, y] = pts[i]; const ok = marcoFeito(m.n); const open = marcoAberto(m.n); const atual = !ok && open;
    return `<g class="mk ${ok ? 'ok' : atual ? 'now' : 'lock'}" ${open ? `data-act="marco" data-n="${m.n}" role="button" tabindex="0"` : ''} aria-label="Marco ${m.n}: ${m.nome}${ok ? ', concluído' : open ? '' : ', bloqueado'}">
      <circle cx="${x}" cy="${y}" r="18"/><text x="${x}" y="${y + 5}" text-anchor="middle">${ok ? '✓' : m.n}</text>
      <text class="alt" x="${x}" y="${y - 28}" text-anchor="middle">${m.alt} m</text></g>`;
  }).join('');
  const walked = deco || !feitosN ? '' : `<path class="trail done" d="${smooth(route.slice(0, feitosN + 1 + (feitosN === 12 ? 1 : 0)), false)}"/>`;
  return `<svg class="perfil" viewBox="0 0 1140 470" ${deco ? 'preserveAspectRatio="xMidYMax slice"' : ''} role="img" aria-label="Perfil da serra com os 12 marcos da trilha">
    <path class="r2" d="${ridge2}"/><path class="r1" d="${ridge}"/>
    <path class="trail" d="${smooth(route, false)}"/>${walked}
    <g class="summit"><path d="M${top[0]} ${top[1]} V${top[1] - 44} H${top[0] + 30} L${top[0] + 23} ${top[1] - 35} L${top[0] + 30} ${top[1] - 26} H${top[0]}"/><text x="${top[0] - 10}" y="${top[1] - 30}" text-anchor="end">UNIFEI</text></g>
    ${marks}</svg>`;
}

    ${evolucaoHTML()}
    <h3>📓 Caderno de erros</h3>${cadernoHTML()}
    <p class="cert">Código de verificação: <b>${certCode()}</b> · ${esc(S.turma)} · Rodada 2</p>
    <h3>Ranking geral</h3><div id="podio"></div>
    <div class="row center"><button class="btn ghost" data-act="mapa">Rever as resoluções no mapa</button><button class="btn ghost" data-act="novo">Começar de novo</button></div>
  </section></div></main>`;
}

/* ---------- recordes e professor ---------- */
function hallList(rows) { return rows.length ? `<ol class="hall">${rows.map((h, i) => `<li><span class="h-n">${i + 1}</span><b>${esc(h.name)}</b><span>${esc(h.turma)} · ${esc(h.rank)}</span><span>${h.min}/36 acertos</span><b>${h.pts}</b></li>`).join('')}</ol>` : '<p class="muted">Ninguém concluiu a trilha neste aparelho ainda.</p>'; }
const sortedHall = () => DB.hall.slice().sort((a, b) => b.pts - a.pts || b.min - a.min || a.t - b.t);
function hallView() { return `<main class="page">${hud()}<div class="wrap narrow"><section class="card"><h2>Recordes deste aparelho</h2>${hallList(sortedHall().slice(0, 20))}<div class="row"><button class="btn ghost" data-act="${S ? 'mapa' : 'cover'}">Voltar</button></div></section></div></main>`; }
function teacherView() {
  return `<main class="page">${hud()}<div class="wrap"><section class="card"><h2>Área do professor · Rodada 2</h2>
    <div class="relbox ${LIB.ok ? 'on' : ''}"><h3 style="margin-top:0">${LIB.ok ? '🔓 Rodada 2 liberada para os alunos' : '🔒 Rodada 2 bloqueada para os alunos'}</h3>
      <p class="muted">${LIB.ok ? 'Os alunos já podem começar. Bloquear de novo fecha a trilha em todos os aparelhos em até 15 segundos; o progresso de cada um fica guardado.' : 'Os alunos veem a capa com o aviso de bloqueio. Ao liberar, a trilha abre sozinha em todos os aparelhos em até 15 segundos.'}${LIB.em ? ` Última mudança: ${new Date(LIB.em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}.` : ''}${LIB.err ? ' <b>Sem conexão com a chave de liberação agora.</b>' : ''}</p>
      <div class="row"><button class="btn ${LIB.ok ? 'ghost' : 'hot'}" data-act="lib" data-v="${LIB.ok ? 0 : 1}">${LIB.ok ? 'Bloquear a rodada 2' : 'Liberar a rodada 2 agora'}</button></div></div>
    <div class="tcards"><div><h3>Modo projeção</h3><p>Libera todos os marcos, mostra o botão “Mostrar resposta” e desliga a tela cheia, para resolver com a turma no projetor.</p><button class="btn hot" data-act="proj">${projection ? 'Desligar' : 'Ligar'} projeção</button></div>
    <div><h3>Questões</h3><p>36 questões inéditas (diferentes da rodada 1) no formato da prova (5 alternativas, sem calculadora), 3 por item do conteúdo programático. A ordem das alternativas muda para cada aluno.</p><button class="btn ghost" data-act="${S ? 'mapa' : 'projmap'}">Abrir o mapa</button></div></div>
    <h3>Painel ao vivo</h3><div id="prof-live"></div>
    <details class="local"><summary>Trilhas concluídas neste aparelho</summary>${TURMAS.map((t) => `<h3>${t}</h3>${hallList(sortedHall().filter((h) => h.turma === t))}`).join('')}</details>
    <div class="row"><button class="btn ghost" data-act="cover">Sair</button><button class="link" data-act="wipe">Apagar dados deste aparelho</button></div></section></div></main>`;
}
function modalView() {
  if (!modal) return '';
  let inner = '';
  if (modal.type === 'pin') inner = `<h3>Área do professor</h3><form data-form="pin" autocomplete="off"><label class="fld"><span>Senha</span><input name="pin" type="password" required></label>${modal.err ? '<p class="err">Senha incorreta.</p>' : ''}<div class="row"><button class="btn hot" type="submit">Entrar</button><button class="btn ghost" type="button" data-act="close">Cancelar</button></div></form>`;
  if (modal.type === 'menu') inner = `<h3>Menu</h3><div class="menu">${S ? '<button class="btn ghost" data-act="mapa">Mapa da trilha</button>' : ''}<button class="btn ghost" data-act="hall">Recordes deste aparelho</button><button class="btn ghost" data-act="pin">Área do professor</button><button class="btn ghost" data-act="cover">Tela inicial</button><button class="btn ghost" data-act="close">Fechar</button></div>`;
  return `<div class="veil" data-act="veil"><div class="modal card" role="dialog" aria-modal="true">${inner}</div></div>`;
}

/* ---------- render ---------- */
function render() {
  if (screen === 'teacher' && !teacherKey) screen = 'cover';
  const V = { cover: coverView, mapa: mapaView, questao: questaoView, marco: marcoView, final: finalView, hall: hallView, teacher: teacherView }[screen] || coverView;
  if (!S && ['mapa', 'questao', 'marco', 'final'].includes(screen) && !projection) screen = 'cover';
  if (bloqueada() && ['mapa', 'questao', 'marco'].includes(screen)) screen = 'cover';
  $app.innerHTML = (S || screen === 'cover' || screen === 'hall' || screen === 'teacher' || projection ? V() : coverView()) + modalView() + '<div id="toast" role="status" aria-live="polite"></div>';
  document.body.dataset.screen = screen; document.body.classList.toggle('proj', projection);
  syncFull();
  if (screen === 'teacher') startProf(); else stopProf();
  const prev = onlineWhere;
  onlineWhere = !S ? '' : screen === 'questao' ? `Marco ${QUESTOES[cur].m} · ${QUESTOES[cur].nome}` : screen === 'marco' ? `Venceu o marco ${marcoV}` : 'No mapa';
  if (S && !S.finished && onlineWhere !== prev && ['questao', 'mapa', 'marco'].includes(screen)) syncPost([], true);
  if (!hbTimer) heartbeat();
  if (screen === 'marco') fillPodium(document.getElementById('podio'), marcoV - 1, 'sol', 10);
  if (screen === 'final') fillPodium(document.getElementById('podio'), 0, 'final', 50);
}
function go(s) { screen = s; modal = null; render(); window.scrollTo(0, 0); }
function openMarco(n) {
  marcoV = n; review = marcoFeito(n) && !projection;
  const k = ks(n).find((x) => !done(x)); cur = k == null ? ks(n)[0] : k; sel = -1; reveal = false; go('questao');
}

/* ---------- respostas ---------- */
function confirmar() {
  if (sel < 0 || done(cur) || !S) return;
  const q = QUESTOES[cur]; const x = st(cur); x.wrong = x.wrong || [];
  x.tries += 1; const ok = sel === 0;
  if (ok) x.ok = true; else x.wrong.push(sel);
  S.e[cur] = x;
  const evs = [{ ev: ok ? 'Acertou' : 'Errou', det: `Marco ${q.m} · ${q.nome}${x.dica ? ' (com lanterna)' : ''}${ok ? '' : x.tries >= 2 ? ` (−${PENAL} pontos)` : ' (1ª tentativa)'}`, pts: ok ? ptsOf(cur) : 0 }];
  let vento = false;
  if (done(cur)) {
    if (ok && x.tries === 1 && !x.dica) { S.streak = (S.streak || 0) + 1; if (S.streak % 3 === 0) { S.bonus = (S.bonus || 0) + BONUS; vento = true; evs.push({ ev: 'Vento a favor', det: `${S.streak} seguidas de primeira (+${BONUS})`, pts: BONUS }); } }
    else S.streak = 0;
  }
  if (marcoFeito(q.m) && !S.fim[q.m]) {
    S.fim[q.m] = Date.now();
    evs.push({ ev: 'Concluiu o marco', det: `Marco ${q.m} · ${MARCOS[q.m - 1].nome}`, pts: ptsSala(q.m) });
    if (MARCOS.every((m) => marcoFeito(m.n))) {
      S.finished = true; S.t1 = Date.now();
      evs.push({ ev: 'Chegou ao cume', det: `${acertos()}/36 acertos · ${rankLabel()}`, pts: pontos() });
      DB.hall.push({ name: S.name, turma: S.turma, pts: pontos(), min: acertos(), rank: rankLabel(), t: Date.now() }); if (DB.hall.length > 200) DB.hall = sortedHall().slice(0, 200);
    }
  }
  if (!S.temp) { save(); syncEv(evs); }
  sel = -1; render();
  toast(vento ? `Vento a favor! ${S.streak} seguidas de primeira: +${BONUS} de bônus` : ok ? `${x.tries === 1 ? 'Certo de primeira!' : 'Certo!'} +${ptsOf(cur)}` : x.tries >= 2 ? `Dois erros: −${PENAL} pontos. Leia a resolução.` : 'Ainda não. Mais uma tentativa.');
}
function proxima() {
  const n = QUESTOES[cur].m; const j = cur % POR;
  if (j < POR - 1) { cur += 1; sel = -1; reveal = false; render(); window.scrollTo(0, 0); return; }
  if (review || projection) { go('mapa'); return; }
  marcoV = n; go('marco');
}

/* ---------- eventos ---------- */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'veil') { if (e.target === b) { modal = null; render(); } return; }
  if (a === 'alt') { if (b.disabled) return; sel = +b.dataset.i; render(); }
  else if (a === 'conf') confirmar();
  else if (a === 'prox') proxima();
  else if (a === 'marco') openMarco(+b.dataset.n);
  else if (a === 'mapa') go(S || projection ? 'mapa' : 'cover');
  else if (a === 'dica') { if (!S || done(cur) || review) return; const x = st(cur); x.wrong = x.wrong || []; x.dica = true; S.e[cur] = x; if (!S.temp) { save(); syncEv([{ ev: 'Acendeu a lanterna', det: `Marco ${QUESTOES[cur].m} · ${QUESTOES[cur].nome} (−${DICA})`, pts: 0 }]); } render(); }
  else if (a === 'revq') { const k = +b.dataset.k; marcoV = QUESTOES[k].m; review = true; cur = k; sel = -1; reveal = false; go('questao'); }
  else if (a === 'lib') { const v = b.dataset.v === '1'; b.disabled = true; setLib(v).then(() => { toast(v ? 'Rodada 2 liberada para os alunos.' : 'Rodada 2 bloqueada.'); render(); }).catch(() => { toast('Não consegui mudar a liberação. Confira a internet e tente de novo.'); render(); }); }
  else if (a === 'projmap') { projection = true; if (!S) S = { temp: true, name: 'Projeção', turma: '—', seed: 7, e: {}, fim: {}, finished: false }; go('mapa'); }
  else if (a === 'final') go('final');
  else if (a === 'cover') { projection = false; if (S && S.temp) S = DB.cur; go('cover'); }
  else if (a === 'menu') { modal = { type: 'menu' }; render(); }
  else if (a === 'close') { modal = null; render(); }
  else if (a === 'hall') go('hall');
  else if (a === 'pin') { modal = { type: 'pin' }; render(); setTimeout(() => { const i = document.querySelector('.modal input'); if (i) i.focus(); }, 30); }
  else if (a === 'proj') { projection = !projection; if (!projection && S && S.temp) S = DB.cur; render(); }
  else if (a === 'reveal') { reveal = !reveal; render(); }
  else if (a === 'prof-filtro') { prof.filtro = b.dataset.id; renderProf(); }
  else if (a === 'prof-aba') { prof.aba = b.dataset.id; renderProf(); }
  else if (a === 'prof-pod') { prof.pod = +b.dataset.i; renderProf(); }
  else if (a === 'novo') { if (confirm('Começar uma nova subida? O resultado atual continua nos recordes deste aparelho.')) { S = null; DB.cur = null; save(); go('cover'); } }
  else if (a === 'wipe') { if (confirm('Apagar a trilha atual e os recordes deste aparelho?')) { DB = { cur: null, hall: [] }; S = null; save(); go('cover'); } }
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || modal) return;
  if (e.key === 'Enter' && e.target.closest && e.target.closest('.mk')) { openMarco(+e.target.closest('.mk').dataset.n); return; }
  if (screen !== 'questao') return;
  const li = 'abcde'.indexOf(e.key.toLowerCase());
  if (li >= 0 && !done(cur) && !review) { const oi = ordem(cur)[li]; if (!(st(cur).wrong || []).includes(oi)) { sel = oi; render(); } }
  else if (e.key === 'Enter') { if (done(cur) || review) proxima(); else confirmar(); }
});
document.addEventListener('submit', (e) => {
  e.preventDefault(); const f = e.target;
  if (f.dataset.form === 'start') {
    const nome = f.nome.value.trim().replace(/\s+/g, ' '); const turma = f.turma.value;
    if (nome.length < 3) return;
    if (bloqueada()) { render(); return; }
    projection = false; newGame(nome, turma); go('mapa');
  }
  if (f.dataset.form === 'pin') { if (fnv('missao:' + norm(f.pin.value)) === PIN_HASH) { teacherKey = norm(f.pin.value); modal = null; go('teacher'); } else { modal = { type: 'pin', err: true }; render(); } }
});
render();
const reabrir = () => { if (LIB.ok && S && screen === 'cover') screen = S.finished ? 'final' : 'mapa'; };
checkLib().then(() => { reabrir(); render(); });
libTimer = setInterval(() => { if (!document.hidden) pollLib(); }, 15000);

})();
</script>
</body>
</html>
