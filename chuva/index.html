<style>
:root {
  --shell: #CFCBD9; --shell2: #B7B2C6; --shell3: #8F89A3; --ink: #2B2638; --plum: #8B2A5B; --plum2: #6C1F46;
  --l0: #E3EBC8; --l1: #B6C98B; --l2: #6F8A45; --l3: #233214; --good: #2F6B2A; --bad: #8E2A1B;
  --bg: #EDEAF2;
  --fp: 'Silkscreen', 'Courier New', monospace; --fm: 'IBM Plex Mono', ui-monospace, monospace; --fb: 'Rubik', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { background: var(--bg); }
body { background: radial-gradient(1000px 600px at 50% -10%, #FFFFFF, var(--bg) 60%) fixed, var(--bg); color: var(--ink); font-family: var(--fb); font-size: 16px; line-height: 1.5; min-height: 100vh; }
#app { max-width: 1180px; margin: 0 auto; padding: 0 16px 40px; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 3px solid var(--plum); outline-offset: 2px; }
h1, h2 { font-family: var(--fp); font-weight: 400; line-height: 1.05; margin: 0 0 .4em; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.note { color: #5C5670; font-size: 14px; }
.btn { display: inline-grid; gap: 2px; text-align: left; border: 0; border-radius: 999px; padding: 11px 20px; background: var(--plum); color: #fff; font-weight: 700; box-shadow: 0 4px 0 var(--plum2), inset 0 2px 0 rgba(255,255,255,.2); transition: transform .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--plum2); }
.btn small { font-weight: 400; font-size: 12px; opacity: .85; }
.btn.big { font-size: 20px; padding: 14px 24px; border-radius: 20px; }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--shell3); border-radius: 20px; }
.btn.sm { padding: 6px 14px; font-size: 14px; }
.btn.danger { color: var(--bad); }
.lnk { background: none; border: 0; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
.top { display: flex; align-items: center; gap: 12px; padding: 14px 0; flex-wrap: wrap; }
.top .logo { height: 32px; width: auto; }
.top .lnk { margin-left: auto; }
.tag { font-family: var(--fp); font-size: 12px; letter-spacing: .06em; color: var(--shell3); text-transform: uppercase; }

/* início */
.title { position: relative; text-align: center; padding: 30px 0 26px; overflow: hidden; }
.title h1 { font-size: clamp(42px, 9vw, 96px); color: var(--ink); text-shadow: 4px 4px 0 var(--l1); position: relative; }
.title p { max-width: 52ch; margin: 0 auto; color: #5C5670; font-size: 18px; position: relative; }
.rain span { position: absolute; top: -40px; left: var(--x); width: 34px; height: 34px; color: var(--l2); opacity: .55; animation: fall 5s linear var(--d) infinite; }
.rain svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; }
@keyframes fall { to { transform: translateY(360px) rotate(40deg); } }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 18px; }
.panel { background: #fff; border-radius: 22px; padding: 18px; box-shadow: 0 6px 0 var(--shell2), 0 16px 30px rgba(43,38,56,.08); }
.panel h2 { font-size: 20px; }
form.panel { display: grid; gap: 12px; }
.panel label { display: grid; gap: 4px; font-weight: 600; }
input:not([type=radio]) { font: inherit; font-size: 18px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--shell2); background: #FAF9FC; color: var(--ink); }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-weight: 600; margin-bottom: 4px; }
.seg { display: flex; gap: 8px; }
.seg label { flex: 1; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; text-align: center; padding: 9px; border-radius: 12px; border: 2px solid var(--shell2); font-family: var(--fp); }
.seg input:checked + span { background: var(--ink); color: var(--l0); border-color: var(--ink); }
.seg input:focus-visible + span { outline: 3px solid var(--plum); }
.modes { display: grid; grid-template-columns: 1.2fr 1fr; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--shell2); background: #FAF9FC; border-radius: 999px; padding: 4px 10px; font-size: 13px; color: #5C5670; }
.chip.on { border-color: var(--l2); background: var(--l0); color: var(--l3); font-weight: 600; }
.how ol { margin: 0 0 12px; padding-left: 20px; }
.how li { margin: 6px 0; }
.best { font-family: var(--fp); font-size: 13px; }

/* console */
body.playing { overflow-x: hidden; }
.play { padding-top: 16px; }
.console { display: grid; grid-template-columns: 90px minmax(0, 1fr) 250px; gap: 18px; align-items: stretch; background: linear-gradient(180deg, var(--shell), var(--shell2)); border-radius: 30px 30px 60px 30px; padding: 22px; box-shadow: inset 0 3px 0 rgba(255,255,255,.6), inset 0 -6px 0 rgba(0,0,0,.08), 0 20px 40px rgba(43,38,56,.25); }
.side { display: flex; flex-direction: column; gap: 14px; }
.side.left { align-items: center; justify-content: space-between; padding: 30px 0; }
.dpad { position: relative; width: 74px; height: 74px; }
.dpad i { position: absolute; background: var(--ink); border-radius: 6px; box-shadow: 0 3px 0 #120F1A; }
.dpad i:first-child { left: 25px; top: 0; width: 24px; height: 74px; } .dpad i:last-child { top: 25px; left: 0; width: 74px; height: 24px; }
.grille { display: grid; grid-template-columns: repeat(3, 8px); gap: 7px; transform: rotate(-25deg); }
.grille i { width: 8px; height: 30px; border-radius: 4px; background: var(--shell3); box-shadow: inset 0 2px 2px rgba(0,0,0,.25); }
.screenwrap { background: #4A455A; border-radius: 16px 16px 40px 16px; padding: 12px 18px 22px; display: grid; gap: 8px; min-width: 0; }
.brand-l { font-family: var(--fp); font-size: 11px; color: #BDB8CC; letter-spacing: .08em; }
.brand-l span { color: #E59BC2; margin-left: 8px; }
.lcd { position: relative; background: var(--l0); border-radius: 6px; padding: 10px; box-shadow: inset 0 0 0 3px rgba(35,50,20,.25), inset 0 6px 14px rgba(35,50,20,.25); color: var(--l3); display: grid; grid-template-rows: auto 1fr auto; height: min(68vh, 600px); min-height: 380px; overflow: hidden; }
.lcd::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(35,50,20,.05) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(35,50,20,.04) 0 1px, transparent 1px 3px); }
.lcd.hurt { animation: hurt .4s; }
@keyframes hurt { 0%, 100% { transform: none; } 20% { transform: translateX(-8px); background: #E9C9A8; } 60% { transform: translateX(6px); } }
.lcd.lvlup { animation: lvl .8s; }
@keyframes lvl { 30% { background: var(--l1); } }
.hud { display: grid; grid-template-columns: 1.4fr .8fr .8fr 1.1fr; gap: 6px; border-bottom: 3px solid var(--l3); padding-bottom: 6px; }
.hud span { display: grid; }
.hud small { font-family: var(--fp); font-size: 10px; color: var(--l2); }
.hud b { font-family: var(--fp); font-weight: 400; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hud .lives b i { font-style: normal; opacity: .2; }
.field { position: relative; overflow: hidden; }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: repeating-linear-gradient(90deg, var(--l3) 0 8px, var(--l2) 8px 16px); }
.drop { position: absolute; left: 0; top: 0; width: 168px; display: grid; grid-template-columns: 28px 1fr; grid-template-rows: auto auto; column-gap: 6px; padding: 6px 8px; background: var(--l0); border: 3px solid var(--l3); border-radius: 4px; box-shadow: 4px 4px 0 var(--l1); will-change: transform; z-index: 2; }
.drop .ic { grid-row: span 2; width: 28px; height: 28px; color: var(--l3); }
.drop .ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linejoin: round; }
.drop .qt { font-family: var(--fm); font-size: 12.5px; line-height: 1.25; font-weight: 500; }
.drop .qt b { font-weight: 700; }
.drop .un { font-family: var(--fp); font-size: 10px; color: var(--l2); text-align: right; }
.drop.low { background: #EBD9B8; border-color: var(--bad); box-shadow: 4px 4px 0 #D3B48A; }
.drop.gold { background: #F3E39A; border-color: #6B5410; box-shadow: 4px 4px 0 #C9AE4A; }
.drop.gold .ic { color: #6B5410; } .drop.gold .ic svg { fill: #E0B92E; }
.drop.pop { animation: pop .5s forwards; }
@keyframes pop { 50% { scale: 1.15; filter: brightness(1.3); } 100% { opacity: 0; scale: 1.3; } }
.drop.splash { animation: splash .5s forwards; }
@keyframes splash { to { opacity: 0; filter: blur(2px); } }
.pts { position: absolute; left: 0; top: 0; font-family: var(--fp); font-size: 18px; color: var(--good); z-index: 3; pointer-events: none; animation: up .9s forwards; }
@keyframes up { to { margin-top: -40px; opacity: 0; } }
.slowbar { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); font-family: var(--fp); font-size: 12px; background: var(--l3); color: var(--l0); padding: 2px 10px; z-index: 3; }
.ticker { font-family: var(--fm); font-size: 13px; min-height: 2.6em; border-top: 3px solid var(--l3); padding-top: 6px; }
.ticker.good { color: var(--good); font-weight: 600; } .ticker.bad { color: var(--bad); } .ticker.lvl { font-family: var(--fp); }
.pauseov { position: absolute; inset: 0; z-index: 5; background: rgba(227,235,200,.92); display: grid; place-content: center; justify-items: center; gap: 12px; }
.pauseov b { font-family: var(--fp); font-size: 34px; font-weight: 400; }
.side.right { justify-content: center; }
.disp { background: var(--l0); border-radius: 8px; padding: 6px 12px; box-shadow: inset 0 3px 8px rgba(35,50,20,.3); color: var(--l3); }
.disp small { font-family: var(--fp); font-size: 10px; color: var(--l2); }
.disp b { display: block; font-family: var(--fp); font-weight: 400; font-size: 30px; min-height: 1.2em; letter-spacing: .04em; }
.disp b:empty::after { content: '_'; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.disp.err { animation: err .4s; }
@keyframes err { 30% { background: #EBC0B0; } }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.pad button { aspect-ratio: 1.15; border: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #A8467A, var(--plum) 60%, var(--plum2)); color: #fff; font-family: var(--fp); font-size: 20px; box-shadow: 0 4px 0 #4D1532; }
.pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 #4D1532; }
.pad button[data-k="del"], .pad button[data-k=","] { background: radial-gradient(circle at 35% 30%, #6C6880, #4A455A 70%); box-shadow: 0 4px 0 #2B2638; }
.pad .ok { grid-column: span 3; aspect-ratio: auto; border-radius: 999px; padding: 10px; font-size: 22px; background: radial-gradient(circle at 35% 30%, #5E8F3A, var(--l2) 60%, #3F5A26); box-shadow: 0 4px 0 #2A3C17; }
.sysbtns { display: flex; gap: 10px; justify-content: center; }
.sysbtns button { border: 0; border-radius: 999px; padding: 4px 14px; background: var(--shell3); color: #fff; font-family: var(--fp); font-size: 11px; transform: rotate(-20deg); box-shadow: 0 2px 0 #6B6580; }
.kbhint { text-align: center; color: #5C5670; font-size: 13px; }

/* fim */
.result { text-align: center; padding: 10px 0 20px; }
.result h1 { font-size: clamp(40px, 8vw, 80px); text-shadow: 4px 4px 0 var(--l1); }
.big b { font-family: var(--fp); font-weight: 400; font-size: 64px; display: block; line-height: 1; }
.big span { font-family: var(--fp); font-size: 13px; color: var(--plum); }
.nums { list-style: none; display: flex; justify-content: center; gap: 22px; padding: 0; margin: 16px 0 0; flex-wrap: wrap; }
.nums li { display: grid; font-size: 13px; color: #5C5670; }
.nums b { font-family: var(--fp); font-weight: 400; font-size: 26px; color: var(--ink); }
.over-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 20px; }
.xray { width: 100%; border-collapse: collapse; font-size: 14px; }
.xray th, .xray td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #E4E1EC; }
.xray th { font-family: var(--fp); font-size: 10px; color: var(--shell3); font-weight: 400; }
.xray td:nth-child(3), .xray td:nth-child(4) { font-family: var(--fm); text-align: center; }
.xray tr.warn td { background: #F7E4DD; } .xray tr.good td { background: #EAF1DA; }
.missed { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.missed li span { display: block; font-family: var(--fm); font-size: 13px; }
.missed li b { font-family: var(--fp); font-weight: 400; color: var(--bad); }
.missed li small { display: block; color: #5C5670; }

.page h1 { font-size: 44px; }
.hall { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 6px; }
.hall li { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 12px; align-items: center; padding: 10px 14px; background: #fff; border-radius: 14px; box-shadow: 0 3px 0 var(--shell2); }
.hall .pos { font-family: var(--fp); color: var(--plum); } .hall small { color: #5C5670; } .hall .pz { font-family: var(--fp); } .hall .dt { font-size: 12px; color: #5C5670; }
.tcards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
.veil { position: fixed; inset: 0; background: rgba(43,38,56,.5); display: grid; place-items: center; padding: 16px; z-index: 30; }
.modalbox { width: min(420px, 100%); background: #fff; border-radius: 22px; padding: 20px; }
.modalbox form { display: grid; gap: 12px; } .modalbox label { display: grid; gap: 4px; font-weight: 600; }
.err { color: var(--bad); margin: 0; }

body.proj #app { max-width: 1600px; }
body.proj .lcd { height: 78vh; }
body.proj .drop { width: 230px; } body.proj .drop .qt { font-size: 16px; }

@media (max-width: 960px) {
  .console { grid-template-columns: minmax(0, 1fr); border-radius: 26px 26px 50px 26px; padding: 14px; }
  .side.left { display: none; }
  .side.right { display: grid; grid-template-columns: 1fr; }
  .pad { grid-template-columns: repeat(6, 1fr); }
  .pad .ok { grid-column: span 6; }
  .pad button { aspect-ratio: auto; padding: 10px 0; border-radius: 14px; }
  .lcd { height: 46vh; min-height: 300px; }
  .sysbtns button { transform: none; }
  .side.right { gap: 8px; }
  .home-grid, .over-grid, .tcards { grid-template-columns: minmax(0, 1fr); }
  .kbhint { display: none; }
}
@media (max-width: 480px) {
  .play { padding-top: 6px; }
  .console { padding: 10px; }
  .screenwrap { padding: 8px 8px 14px; }
  .drop { width: 150px; } .drop .qt { font-size: 11.5px; }
  .pad { gap: 6px; } .pad button { padding: 7px 0; font-size: 18px; } .pad .ok { padding: 7px; }
  .disp b { font-size: 24px; }
  .hud b { font-size: 16px; }
  .modes { grid-template-columns: 1fr; }
  .hall li { grid-template-columns: 34px 1fr auto; } .hall .dt { display: none; }
}
@media (prefers-reduced-motion: reduce) { .rain span, .lcd.hurt, .lcd.lvlup { animation: none !important; } }

[hidden]{display:none!important}
</style>
</head>

/* =========================================================
   CHUVA DE SÓLIDOS — gerador de questões curtas (π = 3)

   Nível 2: números maiores. Nível 3: duas etapas.
   ========================================================= */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const nf = (v) => Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
const TRIP = [[3, 4, 5], [6, 8, 10], [9, 12, 15], [8, 15, 17], [7, 24, 25], [12, 16, 20], [4, 3, 5], [8, 6, 10], [12, 5, 13], [15, 8, 17]];

const TOPICS = [
  { id: 'eq', nome: 'Cilindro equilátero', q: 1, icon: 'cyl' },
  { id: 'cap', nome: 'Capacidade em litros', q: 2, icon: 'cyl' },
  { id: 'cone', nome: 'Cone: geratriz, área, volume', q: 3, icon: 'cone' },
  { id: 'setor', nome: 'Setor que vira cone', q: 4, icon: 'cone' },
  { id: 'esp', nome: 'Entre cilindro e cone', q: 5, icon: 'cyl' },
  { id: 'esf', nome: 'Esfera: volume e massa', q: 6, icon: 'sph' },

const GEN = {
  eq(L) {
    const r = L === 1 ? ri(1, 4) : ri(2, 9); const v = L === 1 ? pick([0, 1]) : ri(0, 3);
    if (v === 0) return { t: `Cil. equilátero<br>r = ${r} cm · <b>V?</b>`, ans: 6 * r ** 3, u: 'cm³', sol: `h = 2r = ${2 * r}; V = 3 · ${r}² · ${2 * r} = ${6 * r ** 3}` };
    if (v === 1) return { t: `Cil. equilátero<br>seção = ${4 * r * r} cm² · <b>r?</b>`, ans: r, u: 'cm', sol: `seção = (2r)² = 4r² = ${4 * r * r} ⇒ r = ${r}` };
    if (v === 2) return { t: `Cil. equilátero<br>r = ${r} cm · <b>área total?</b>`, ans: 18 * r * r, u: 'cm²', sol: `2·3·${r}² + 2·3·${r}·${2 * r} = ${6 * r * r} + ${12 * r * r} = ${18 * r * r}` };
    return { t: `Cil. equilátero<br>seção = ${4 * r * r} cm² · <b>V?</b>`, ans: 6 * r ** 3, u: 'cm³', sol: `r = ${r}, h = ${2 * r}; V = 3 · ${r * r} · ${2 * r} = ${6 * r ** 3}` };
  },
  cap(L) {
    if (L === 1) { const r = ri(1, 5); const h = pick([2, 4, 5, 10]); return { t: `Cilindro r = ${r}, h = ${h} cm<br><b>quantos mL?</b>`, ans: 3 * r * r * h, u: 'mL', sol: `3 · ${r}² · ${h} = ${3 * r * r * h} cm³ = ${3 * r * r * h} mL` }; }
    const r = ri(2, 10); const h = pick([5, 10, 20, 25]); const V = 3 * r * r * h;
    if (L === 2) return { t: `Cilindro d = ${2 * r}, h = ${h} cm<br><b>quantos litros?</b>`, ans: V / 1000, u: 'L', sol: `r = ${r}; 3 · ${r * r} · ${h} = ${nf(V)} mL = ${nf(V / 1000)} L` };
    const c = pick([100, 150, 200, 250]); const n = Math.floor(V / c);
    if (n < 2) return GEN.cap(2);
    return { t: `Garrafa d = ${2 * r}, h = ${h} cm<br><b>copos de ${c} mL cheios?</b>`, ans: n, u: 'copos', sol: `3 · ${r * r} · ${h} = ${nf(V)} mL; ${nf(V)} ÷ ${c} ⇒ ${n}` };
  },
  cone(L) {
    const [r, h, g] = L === 1 ? pick(TRIP.slice(0, 2).concat([TRIP[6]])) : pick(TRIP); const v = L === 1 ? pick([0, 2]) : ri(0, 3);
    if (v === 0) return { t: `Cone r = ${r}, h = ${h}<br><b>geratriz?</b>`, ans: g, u: 'cm', sol: `g² = ${r}² + ${h}² = ${g * g} ⇒ g = ${g}` };
    if (v === 1) return { t: `Cone r = ${r}, h = ${h}<br><b>área lateral?</b>`, ans: 3 * r * g, u: 'cm²', sol: `g = ${g}; 3 · ${r} · ${g} = ${3 * r * g}` };
    if (v === 2) return { t: `Cone r = ${r}, h = ${h}<br><b>V?</b>`, ans: r * r * h, u: 'cm³', sol: `3 · ${r}² · ${h} ÷ 3 = ${r * r * h}` };
    return { t: `Cone r = ${r}, g = ${g}<br><b>V?</b>`, ans: r * r * h, u: 'cm³', sol: `h² = ${g}² − ${r}² ⇒ h = ${h}; V = ${r * r} · ${h} = ${r * r * h}` };
  },
  setor(L) {
    if (L === 1) { const ang = pick([90, 120, 180, 240, 270]); let g; do { g = ri(4, 24); } while (!Number.isInteger((g * ang) / 360)); return { t: `Setor ${ang}°, raio ${g}<br><b>raio do cone?</b>`, ans: (g * ang) / 360, u: 'cm', sol: `r = ${g} · ${ang} ÷ 360 = ${(g * ang) / 360}` }; }
    const k = ri(1, 5); const big = Math.random() < 0.5; const r = big ? 4 * k : 3 * k; const h = big ? 3 * k : 4 * k; const g = 5 * k; const ang = big ? 288 : 216;
    if (L === 2 || Math.random() < 0.5) return { t: `Setor ${ang}°, raio ${g}<br><b>altura do cone?</b>`, ans: h, u: 'cm', sol: `r = ${g}·${ang}÷360 = ${r}; h² = ${g}² − ${r}² ⇒ h = ${h}` };
    return { t: `Setor ${ang}°, raio ${g}<br><b>V do cone?</b>`, ans: r * r * h, u: 'cm³', sol: `r = ${r}, h = ${h}; V = ${r * r} · ${h} = ${r * r * h}` };
  },
  esp(L) {
    const r = L === 1 ? ri(1, 4) : ri(2, 10); const h = L === 1 ? ri(2, 6) : ri(3, 15);

    return `<main class="page"><header class="top">${logo()}<span class="tag">Área do professor</span></header><h1>PROFESSOR</h1>
      <div class="tcards"><section class="panel"><h2>Modo projeção</h2><p class="note">Tela e blocos maiores para a turma jogar junta: todos calculam, um aluno digita.</p><button class="btn" data-act="proj">${projection ? 'Desligar' : 'Ligar'}</button></section>
      <section class="panel"><h2>Como as contas são geradas</h2><p class="note">Nível 1: números pequenos e uma fórmula direta. Nível 2: números maiores, diâmetro no lugar do raio, litros. Nível 3: duas etapas (geratriz para achar o volume, massa pela densidade, altura a partir do volume). As medidas da prova não são usadas.</p></section></div>
      ${TURMAS.map((t) => `<h2>${t}</h2>${hallList(Object.values(best).filter((h) => h.turma === t).sort((a, b) => b.pts - a.pts))}`).join('')}
      <p><button class="btn ghost" data-act="home">← Início</button> <button class="btn ghost danger" data-act="wipe">Apagar placar deste computador</button></p></main>`;
  }
  function modalView() {
    if (!modal) return '';
    return `<div class="veil" data-act="veil"><div class="modalbox" role="dialog" aria-modal="true"><h2>Área do professor</h2><form data-form="pin" autocomplete="off"><label>Senha<input name="pin" type="password" required></label>${modal.err ? '<p class="err">Senha incorreta.</p>' : ''}<div class="row"><button class="btn" type="submit">Entrar</button><button class="btn ghost" type="button" data-act="close">Cancelar</button></div></form></div></div>`;
  }
  function render() {
    document.body.classList.toggle('proj', projection);
    document.body.classList.toggle('playing', screen === 'play');
    const V = { home: homeView, play: playView, over: overView, hall: hallView, teacher: teacherView }[screen];
    $app.innerHTML = V() + modalView();
    if (screen === 'play') { hud(); showBuf(); cancelAnimationFrame(raf); lastT = performance.now(); raf = requestAnimationFrame(loop); ticker('Prepare-se…', 'lvl', 1200); }
    const f = $app.querySelector('.modalbox input'); if (f) f.focus();
  }
  const go = (s) => { if (s !== 'play') cancelAnimationFrame(raf); screen = s; modal = null; render(); window.scrollTo(0, 0); };

  function act(a, el, e) {
    switch (a) {
      case 'veil': if (e.target === el) { modal = null; render(); } break;
      case 'close': modal = null; render(); break;
      case 'teacher': modal = { type: 'pin' }; render(); break;
      case 'hall': go('hall'); break;
      case 'home': go('home'); break;
      case 'topic': { const id = el.dataset.id; if (treinoSel.has(id)) { if (treinoSel.size > 1) treinoSel.delete(id); } else treinoSel.add(id); el.classList.toggle('on', treinoSel.has(id)); break; }
      case 'pause': pause(); break;
      case 'resume': pause(false); break;
      case 'quit': if (P && !P.over) { P.paused = false; gameOver(); } break;
      case 'again': newRun(P.mode); go('play'); break;
      case 'copy': {
        const t = `Chuva de Sólidos · Corpos Redondos\n${P.name} (${P.turma}) · ${P.mode === 'treino' ? 'treino' : `arcade, nível ${P.L}`}\n${fmt(P.score)} pontos · ${P.hits} acertos · ${P.fell} caíram · maior combo ×${P.maxCombo}\n${new Date().toLocaleString('pt-BR')}`;
        const done = () => { el.textContent = 'Copiado!'; };
        if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, () => window.prompt('Copie o resultado:', t)); else window.prompt('Copie o resultado:', t);
        break;
      }
      case 'proj': projection = !projection; render(); break;
      case 'wipe': if (window.confirm('Apagar o placar deste computador?')) { DB.hall = []; DB.best = 0; save(); render(); } break;
      default: break;
    }
  }
  $app.addEventListener('click', (e) => {
    const k = e.target.closest('[data-k]'); if (k) { press(k.dataset.k); return; }
    const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act, el, e);
  });
  $app.addEventListener('submit', (e) => {
    e.preventDefault(); const f = e.target;
    if (f.dataset.form === 'start') {
      const name = f.nome.value.trim().replace(/\s+/g, ' '); const tr = f.querySelector('input[name="turma"]:checked'); if (!name || !tr) return;
      DB.last = { name, turma: tr.value }; save();
      const mode = (e.submitter && e.submitter.value) || 'arcade';
      newRun(mode); go('play');
    }
    if (f.dataset.form === 'pin') { if (fnv('missao:' + norm(f.pin.value)) === PIN_HASH) go('teacher'); else { modal = { type: 'pin', err: true }; render(); } }
  });
  document.addEventListener('keydown', (e) => {
    if (screen === 'play' && P && !P.over) {
      if (/^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); return; }
      if (e.key === ',' || e.key === '.') { press(','); e.preventDefault(); return; }
      if (e.key === 'Backspace') { press('del'); e.preventDefault(); return; }
      if (e.key === 'Enter') { press('ok'); e.preventDefault(); return; }
      if (e.key === ' ' || e.key === 'Escape' || e.key === 'p') { pause(); e.preventDefault(); return; }
    }
    if (e.key === 'Escape' && modal) { modal = null; render(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && screen === 'play') pause(true); });
  render();
}());

</script>
</body>
</html>
